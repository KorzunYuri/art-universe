apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-calls-generator
  namespace: mu-spotify
  labels:
    app: spotify-calls-generator
    app.kubernetes.io/name: spotify-calls-generator
spec:
  replicas: 1
  # Not scalable - use Recreate strategy
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spotify-calls-generator
  template:
    metadata:
      labels:
        app: spotify-calls-generator
        app.kubernetes.io/name: spotify-calls-generator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for database..."
              until nc -z postgres-master.mu-data.svc.cluster.local 5432; do
                sleep 2
              done
              echo "Database ready!"
              sleep 10
      containers:
        - name: app
          image: mu-spotify-calls-generator:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: actuator
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m"
            - name: MURAW_SPOTIFY_CALLS_GENERATOR_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spotify-db-credentials
                  key: MURAW_SPOTIFY_CALLS_GENERATOR_DB_PASSWORD
            - name: SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: spotify-api-credentials
                  key: SPOTIFY_CLIENT_ID
            - name: SPOTIFY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: spotify-api-credentials
                  key: SPOTIFY_CLIENT_SECRET
          envFrom:
            - configMapRef:
                name: spotify-common-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "200m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
