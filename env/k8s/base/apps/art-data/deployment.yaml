apiVersion: apps/v1
kind: Deployment
metadata:
  name: art-data
  namespace: mu-apps
  labels:
    app: art-data
    app.kubernetes.io/name: art-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: art-data
  template:
    metadata:
      labels:
        app: art-data
        app.kubernetes.io/name: art-data
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres-master..."
              until nc -z postgres-master.mu-data.svc.cluster.local 5432; do
                sleep 2
              done
              echo "Database ready!"
              sleep 5
      containers:
        - name: app
          image: art-data:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=96m"
            # Database configuration
            - name: AU_DB_MASTER_HOST
              value: "postgres-master.mu-data.svc.cluster.local"
            - name: AU_DB_MASTER_PORT
              value: "5432"
            - name: AU_DB_NAME
              value: "art_universe"
            - name: ART_DATA_DB_SCHEMA
              value: "art"
            - name: ART_DATA_DB_USERNAME
              value: "art_dm"
            - name: ART_DATA_DB_PASSWORD_DM
              valueFrom:
                secretKeyRef:
                  name: art-data-db-credentials
                  key: ART_DATA_DB_PASSWORD_DM
            # Auth configuration (for JWT validation)
            - name: AU_AUTH_DB_SCHEMA
              value: "au_auth"
            - name: AU_AUTH_DB_USERNAME
              value: "au_auth_dm"
            - name: AUTH_JWT_EXPIRATION_MINUTES
              value: "15"
            - name: AUTH_REFRESH_TOKEN_EXPIRATION_DAYS
              value: "7"
            - name: AUTH_JWT_ISSUER
              value: "art-universe"
            - name: AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: au-auth-credentials
                  key: AUTH_JWT_SECRET
            # Application configuration
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: ART_DATA_APP_CORS_ALLOWED_ORIGINS
              value: "http://localhost:4000,http://localhost,http://localhost:80"
            # Zipkin tracing
            - name: ZIPKIN_BASE_URL
              value: "http://zipkin.art-universe-monitoring.svc.cluster.local:9411"
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
