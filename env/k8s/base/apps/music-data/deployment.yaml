apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-data
  namespace: mu-apps
  labels:
    app: music-data
    app.kubernetes.io/name: music-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: music-data
  template:
    metadata:
      labels:
        app: music-data
        app.kubernetes.io/name: music-data
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      initContainers:
        - name: wait-for-database
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres-music-data..."
              until nc -z postgres-music-data.mu-data.svc.cluster.local 5432; do
                sleep 2
              done
              echo "Database ready!"
              sleep 5
      containers:
        - name: app
          image: mu-music-data:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: JAVA_OPTS
              value: "-Xms128m -Xmx384m -XX:MaxMetaspaceSize=96m"
            # Database configuration
            - name: MU_DATA_DB_HOST
              value: "postgres-music-data.mu-data.svc.cluster.local"
            - name: MU_DATA_DB_PORT
              value: "5432"
            - name: MU_DATA_DB_NAME
              value: "music_universe"
            - name: MU_DATA_DB_SCHEMA
              value: "mu"
            - name: MU_DATA_DB_USERNAME
              value: "mu_dm"
            - name: MU_DATA_DB_PASSWORD_DM
              valueFrom:
                secretKeyRef:
                  name: music-data-db-credentials
                  key: MU_DATA_DB_PASSWORD_DM
            # Application configuration
            - name: SPRING_PROFILES_ACTIVE
              value: "local"
            - name: MU_DATA_APP_CORS_ALLOWED_ORIGINS
              value: "http://localhost:4000,http://localhost,http://localhost:80"
            # Zipkin tracing
            - name: ZIPKIN_BASE_URL
              value: "http://zipkin.art-universe-monitoring.svc.cluster.local:9411"
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30  # 5 minutes max (includes Liquibase migrations)
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
