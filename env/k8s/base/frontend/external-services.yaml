# ExternalName services to reference services in other namespaces
# Required for Ingress to route to cross-namespace backends

---
apiVersion: v1
kind: Service
metadata:
  name: lastfm-rest-api
  namespace: mu-frontend
  labels:
    app.kubernetes.io/name: lastfm-rest-api-external
spec:
  type: ExternalName
  externalName: lastfm-rest-api.mu-lastfm.svc.cluster.local
  ports:
    - port: 8080
      targetPort: 8080
      name: http

