apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-lastfm-replica
  namespace: mu-data
  labels:
    app: postgres-lastfm-replica
    app.kubernetes.io/name: postgres-lastfm-replica
spec:
  serviceName: postgres-lastfm-replica
  replicas: 1
  selector:
    matchLabels:
      app: postgres-lastfm-replica
  template:
    metadata:
      labels:
        app: postgres-lastfm-replica
        app.kubernetes.io/name: postgres-lastfm-replica
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-master
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-lastfm-master.mu-data.svc.cluster.local 5432; do
                echo "Waiting for master database..."
                sleep 2
              done
              echo "Master is ready"
        - name: setup-replica
          image: postgres:14
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lastfm-db-credentials
                  key: MURAW_LASTFM_DB_REPLICATION_PASSWORD
          command:
            - sh
            - -c
            - |
              # Only run if data directory is empty
              if [ -z "$(ls -A /var/lib/postgresql/data)" ]; then
                echo "Initializing replica from master..."
                pg_basebackup -h postgres-lastfm-master.mu-data.svc.cluster.local \
                  -D /var/lib/postgresql/data \
                  -U replicator \
                  -P -v -R -X stream -C -S replica_slot
                chown -R postgres:postgres /var/lib/postgresql/data
              else
                echo "Data directory not empty, skipping initialization"
              fi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: postgres:14
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lastfm-db-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
