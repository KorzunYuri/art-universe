apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-lastfm-replica-config
  namespace: mu-data
  labels:
    app: postgres-lastfm-replica
data:
  # Replica configuration is handled by pg_basebackup -R flag
  # which creates standby.signal and primary_conninfo in postgresql.auto.conf
  replica-info: |
    This replica is configured automatically via pg_basebackup with -R flag.
    The standby.signal file and primary_conninfo are created during initialization.
