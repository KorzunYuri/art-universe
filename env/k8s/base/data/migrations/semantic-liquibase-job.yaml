apiVersion: batch/v1
kind: Job
metadata:
  name: semantic-liquibase-migration
  namespace: mu-data
  labels:
    app: semantic-liquibase
    app.kubernetes.io/name: semantic-liquibase
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600  # Clean up after 1 hour
  template:
    metadata:
      labels:
        app: semantic-liquibase
        app.kubernetes.io/name: semantic-liquibase
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres-master to be ready..."
              until nc -z postgres-master.mu-data.svc.cluster.local 5432; do
                echo "Database not ready, waiting..."
                sleep 2
              done
              echo "Database is ready!"
              # Additional wait for postgres to fully initialize
              sleep 5
      containers:
        - name: liquibase
          image: mu-semantic-liquibase:latest
          imagePullPolicy: Never
          env:
            # Database connection
            - name: AU_DB_MASTER_HOST
              value: "postgres-master.mu-data.svc.cluster.local"
            - name: AU_DB_MASTER_PORT
              value: "5432"
            - name: AU_DB_NAME
              value: "art_universe"
            - name: MU_SA_DB_SCHEMA
              value: "mu_semantic_analysis"
            - name: MU_SA_DB_USERNAME
              value: "mu_sa_dm"
            - name: MU_SA_DB_PASSWORD_DM
              valueFrom:
                secretKeyRef:
                  name: semantic-db-credentials
                  key: MU_SA_DB_PASSWORD_DM
            - name: MU_SA_DB_MIGRATIONS_PATH
              value: "db/migration/mu_sa/liquibase/db.changelog.xml"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
