apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-master
  namespace: mu-data
  labels:
    app: postgres-master
    app.kubernetes.io/name: postgres-master
spec:
  serviceName: postgres-master
  replicas: 1
  selector:
    matchLabels:
      app: postgres-master
  template:
    metadata:
      labels:
        app: postgres-master
        app.kubernetes.io/name: postgres-master
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:14
          ports:
            - containerPort: 5432
              name: postgres
          args:
            - "-c"
            - "wal_level=replica"
            - "-c"
            - "max_wal_senders=3"
            - "-c"
            - "max_replication_slots=3"
            - "-c"
            - "wal_keep_size=256"
          env:
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: MURAW_LASTFM_DB_WRITER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MURAW_LASTFM_DB_WRITER_PASSWORD
            - name: MURAW_LASTFM_DB_READER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MURAW_LASTFM_DB_READER_PASSWORD
            - name: MURAW_LASTFM_DB_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MURAW_LASTFM_DB_REPLICATION_PASSWORD
            - name: MU_DATA_DB_PASSWORD_DM
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MU_DATA_DB_PASSWORD_DM
            - name: MU_QUIZ_DB_PASSWORD_DM
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: MU_QUIZ_DB_PASSWORD_DM
            - name: ART_DATA_DB_PASSWORD_DM
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: ART_DATA_DB_PASSWORD_DM
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "128Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-master-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
