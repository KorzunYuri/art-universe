apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-music-data
  namespace: mu-data
  labels:
    app: postgres-music-data
    app.kubernetes.io/name: postgres-music-data
spec:
  serviceName: postgres-music-data
  replicas: 1
  selector:
    matchLabels:
      app: postgres-music-data
  template:
    metadata:
      labels:
        app: postgres-music-data
        app.kubernetes.io/name: postgres-music-data
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:14
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: "postgres"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: music-data-db-credentials
                  key: POSTGRES_PASSWORD
            - name: MU_DATA_DB_PASSWORD_DM
              valueFrom:
                secretKeyRef:
                  name: music-data-db-credentials
                  key: MU_DATA_DB_PASSWORD_DM
            - name: MU_QUIZ_DB_PASSWORD_DM
              valueFrom:
                secretKeyRef:
                  name: music-data-db-credentials
                  key: MU_QUIZ_DB_PASSWORD_DM
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-music-data-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
