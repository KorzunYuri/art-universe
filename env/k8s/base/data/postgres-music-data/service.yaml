apiVersion: v1
kind: Service
metadata:
  name: postgres-music-data
  namespace: mu-data
  labels:
    app: postgres-music-data
    app.kubernetes.io/name: postgres-music-data
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app: postgres-music-data
