# Art Universe - Data Namespace Resources
# PostgreSQL databases and migration jobs

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mu-data

resources:
  # PostgreSQL StatefulSets
  - postgres-lastfm-master/statefulset.yaml
  - postgres-lastfm-master/service.yaml
  - postgres-lastfm-master/configmap.yaml
  - postgres-lastfm-replica/statefulset.yaml
  - postgres-lastfm-replica/service.yaml
  - postgres-lastfm-replica/configmap.yaml
  - postgres-music-data/statefulset.yaml
  - postgres-music-data/service.yaml
  - postgres-music-data/configmap.yaml
  # Migration Jobs
  - migrations/lastfm-liquibase-job.yaml

commonLabels:
  app.kubernetes.io/part-of: art-universe
  app.kubernetes.io/component: data
