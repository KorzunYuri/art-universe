# Art Universe - Data Namespace Resources
# PostgreSQL databases and migration jobs

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mu-data

resources:
  # PostgreSQL StatefulSets
  - postgres-master/statefulset.yaml
  - postgres-master/service.yaml
  - postgres-replica/statefulset.yaml
  - postgres-replica/service.yaml
  # Migration Jobs
  - migrations/lastfm-liquibase-job.yaml

# Note: ConfigMap postgres-master-init is created by the deploy scripts
# from the shared init script at env/docker/common/db/initdb/01-init.sh.
# This allows both Docker Compose and K8s to use the same source file.

commonLabels:
  app.kubernetes.io/part-of: art-universe
  app.kubernetes.io/component: data
