apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: art-universe-monitoring
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.art-universe-monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
        uid: prometheus
