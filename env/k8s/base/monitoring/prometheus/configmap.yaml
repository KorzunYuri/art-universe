apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: art-universe-monitoring
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Kubernetes pod discovery for Art Universe services
      # Scrapes pods with prometheus.io/scrape: "true" annotation
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - mu-lastfm
                - mu-apps
        relabel_configs:
          # Only scrape pods with prometheus.io/scrape annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          # Use prometheus.io/path annotation for metrics path
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Use prometheus.io/port annotation for port
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          # Add pod name label
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          # Add namespace label
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          # Add app label from pod labels
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: replace
            target_label: app

      # Static configs for services without annotations (fallback)
      - job_name: 'music-data'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['music-data.mu-apps.svc.cluster.local:8080']

      - job_name: 'music-quiz'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['music-quiz.mu-apps.svc.cluster.local:8080']

      - job_name: 'lastfm-rest-api'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['lastfm-rest-api.mu-lastfm.svc.cluster.local:8080']

      - job_name: 'lastfm-etl-rest-api'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['lastfm-etl-rest-api.mu-lastfm.svc.cluster.local:8080']

      - job_name: 'lastfm-calls-generator'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['lastfm-calls-generator.mu-lastfm.svc.cluster.local:8080']

      - job_name: 'lastfm-calls-performer'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['lastfm-calls-performer.mu-lastfm.svc.cluster.local:8080']

      - job_name: 'lastfm-response-parser'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['lastfm-response-parser.mu-lastfm.svc.cluster.local:8080']
