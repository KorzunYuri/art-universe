# External LoadBalancer services for production
# These expose services on the same ports as Docker Compose prod
# Note: Docker Desktop's built-in LoadBalancer makes these accessible on localhost
---
apiVersion: v1
kind: Service
metadata:
  name: art-universe-ui-prod
  namespace: mu-frontend
  labels:
    app: art-universe-ui
spec:
  type: LoadBalancer
  selector:
    app: art-universe-ui
  ports:
    - port: 3000
      targetPort: 80
      protocol: TCP
      name: http
---
