# --- Grafana ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-grafana-data
  labels:
    app: grafana
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
