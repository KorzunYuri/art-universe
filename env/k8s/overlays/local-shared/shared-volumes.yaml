# Shared Persistent Volumes - Docker Compose ↔ Kubernetes
# Points hostPath PVs to Docker named volume directories in the WSL2 VM.
# IMPORTANT: Stop Docker Compose before starting K8s (and vice versa).
# PostgreSQL requires exclusive access to its data directory.

# --- PostgreSQL: LastFM Master ---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-lastfm-master-data
  labels:
    app: postgres-lastfm-master
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  hostPath:
    path: /var/lib/docker/volumes/local__lastfm__db-postgres-data/_data
    type: DirectoryOrCreate
  claimRef:
    name: data-postgres-lastfm-master-0
    namespace: mu-data
---
