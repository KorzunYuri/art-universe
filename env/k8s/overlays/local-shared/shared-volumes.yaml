    type: DirectoryOrCreate
  claimRef:
    name: grafana-data
    namespace: art-universe-monitoring
---
# --- Grafana PVC (Deployment needs explicit PVC, unlike StatefulSets) ---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: art-universe-monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  resources:
    requests:
      storage: 1Gi
