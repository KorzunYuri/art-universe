# External LoadBalancer services for local development
# These expose services on the same ports as Docker Compose
# Note: Docker Desktop's built-in LoadBalancer makes these accessible on localhost
# (Shared with local overlay — same ports: 9xxx/4000)
---
apiVersion: v1
kind: Service
metadata:
  name: art-universe-ui-local
  namespace: mu-frontend
  labels:
    app: art-universe-ui
spec:
  type: LoadBalancer
  selector:
    app: art-universe-ui
  ports:
    - port: 4000
      targetPort: 80
      protocol: TCP
      name: http
---
