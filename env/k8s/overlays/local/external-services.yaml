# External LoadBalancer services for local development
# These expose services on the same ports as Docker Compose
# Note: Docker Desktop's built-in LoadBalancer makes these accessible on localhost
---
apiVersion: v1
kind: Service
metadata:
  name: music-ui-local
  namespace: mu-frontend
  labels:
    app: music-ui
spec:
  type: LoadBalancer
  selector:
    app: music-ui
  ports:
    - port: 4000
      targetPort: 80
      protocol: TCP
      name: http
---
apiVersion: v1
kind: Service
metadata:
  name: lastfm-rest-api-local
  namespace: mu-lastfm
  labels:
    app: lastfm-rest-api
spec:
  type: LoadBalancer
  selector:
    app: lastfm-rest-api
  ports:
    - port: 9084
      targetPort: 8080
      protocol: TCP
      name: http
---
