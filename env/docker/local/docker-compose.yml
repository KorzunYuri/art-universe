version: '3.8'

services:
  # Databases
  postgres-master:
    container_name: local__au__db-postgres-master
    image: postgres:14
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 1m
    stop_signal: SIGINT
    env_file:
      - ./database.secrets.env
    volumes:
      - local__au__db-postgres-data:/var/lib/postgresql/data
      - ../common/db/initdb/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=3", "-c", "max_replication_slots=3", "-c", "wal_keep_size=256"]
    ports:
      - "${AU_DB_MASTER_EXTERNAL_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mu__network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.2'

  postgres-replica:
    container_name: local__au__db-postgres-replica
    image: postgres:14
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 1m
    stop_signal: SIGINT
    env_file:
      - ./database.secrets.env
    environment:
      - POSTGRES_MASTER_HOST=postgres-master
      - POSTGRES_MASTER_PORT=5432
      - POSTGRES_REPLICATION_USER=replicator
      - POSTGRES_REPLICATION_PASSWORD=${MURAW_LASTFM_DB_REPLICATION_PASSWORD}
    volumes:
      - local__au__db-postgres-replica-data:/var/lib/postgresql/data
      - ../common/db/initdb/replica-entrypoint.sh:/replica-entrypoint.sh
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    ports:
      - "${AU_DB_REPLICA_EXTERNAL_PORT}:5432"
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mu__network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'
        reservations:
          memory: 64M
          cpus: '0.1'

  # Migrations
  lastfm-liquibase-service:
    container_name: local__lastfm__liquibase
    image: mu-lastfm-liquibase:latest
    env_file:
      - ../common/music-data-raw-lastfm.env
      - ./common.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    depends_on:
      postgres-master:
        condition: service_healthy
    networks:
      - mu__network

  spotify-liquibase-service:
    container_name: local__spotify__liquibase
    image: mu-spotify-liquibase:latest
    env_file:
      - ../common/music-data-raw-spotify.env
      - ./common.env
      - ./music-data-raw-spotify.env
      - ./music-data-raw-spotify.secrets.env
    depends_on:
      postgres-master:
        condition: service_healthy
    networks:
      - mu__network

  # Applications
  lastfm-rest-api:
    container_name: local__lastfm-rest-api__app
    restart: unless-stopped
    image: mu-lastfm-rest-api:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-lastfm.env
      - ./common.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    ports:
      - "${MURAW_LASTFM_REST_API_EXTERNAL_PORT}:${MURAW_LASTFM_REST_API_INTERNAL_PORT}"
    volumes:
      - local__lastfm-rest-api__app-logs:/app/logs
    depends_on:
      postgres-master:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      lastfm-liquibase-service:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_LASTFM_REST_API_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 1Gb
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - mu__network

  lastfm-etl-rest-api:
    container_name: local__lastfm-etl-rest-api__app
    restart: unless-stopped
    stop_grace_period: 1m
    image: mu-lastfm-etl-rest-api:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-lastfm.env
      - ./common.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    ports:
      - "${MURAW_LASTFM_ETL_REST_API_EXTERNAL_PORT}:${MURAW_LASTFM_ETL_REST_API_INTERNAL_PORT}"
    volumes:
      - local__lastfm-etl-rest-api__app-logs:/app/logs
    depends_on:
      postgres-master:
        condition: service_healthy
      lastfm-liquibase-service:
        condition: service_completed_successfully
      music-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_LASTFM_ETL_REST_API_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 1Gb
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - mu__network

  lastfm-calls-generator:
    container_name: local__lastfm-calls-generator__app
    restart: unless-stopped
    stop_grace_period: 1m
    image: mu-lastfm-calls-generator:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-lastfm.env
      - ./common.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    ports:
      - "${MURAW_LASTFM_CALLS_GENERATOR_ACTUATOR_EXTERNAL_PORT}:${MURAW_LASTFM_CALLS_GENERATOR_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - local__lastfm-calls-generator__app-logs:/app/logs
    depends_on:
      postgres-master:
        condition: service_healthy
      lastfm-liquibase-service:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_LASTFM_CALLS_GENERATOR_ACTUATOR_INTERNAL_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 1Gb
          cpus: '0.2'
        reservations:
          memory: 256M
          cpus: '0.05'
    networks:
      - mu__network

  lastfm-calls-performer:
    container_name: local__lastfm-calls-performer__app
    restart: unless-stopped
    stop_grace_period: 1m
    image: mu-lastfm-calls-performer:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-lastfm.env
      - ./common.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    ports:
      - "${MURAW_LASTFM_CALLS_PERFORMER_ACTUATOR_EXTERNAL_PORT}:${MURAW_LASTFM_CALLS_PERFORMER_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - local__lastfm-calls-performer__app-logs:/app/logs
    depends_on:
      postgres-master:
        condition: service_healthy
      lastfm-liquibase-service:
        condition: service_completed_successfully
      lastfm-calls-generator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_LASTFM_CALLS_PERFORMER_ACTUATOR_INTERNAL_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 1Gb
          cpus: '0.2'
        reservations:
          memory: 256M
          cpus: '0.05'
    networks:
      - mu__network

  lastfm-response-parser:
    container_name: local__lastfm-response-parser__app
    restart: unless-stopped
    stop_grace_period: 1m
    image: mu-lastfm-response-parser:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx1536m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-lastfm.env
      - ./common.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    ports:
      - "${MURAW_LASTFM_RESPONSE_PARSER_ACTUATOR_EXTERNAL_PORT}:${MURAW_LASTFM_RESPONSE_PARSER_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - local__lastfm-response-parser__app-logs:/app/logs
    depends_on:
      postgres-master:
        condition: service_healthy
      lastfm-liquibase-service:
        condition: service_completed_successfully
      lastfm-calls-performer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_LASTFM_RESPONSE_PARSER_ACTUATOR_INTERNAL_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 2Gb
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - mu__network

  spotify-rest-api:
    container_name: local__spotify-rest-api__app
    restart: unless-stopped
    image: mu-spotify-rest-api:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-spotify.env
      - ./common.env
      - ./music-data-raw-spotify.env
      - ./music-data-raw-spotify.secrets.env
    ports:
      - "${MURAW_SPOTIFY_REST_API_EXTERNAL_PORT}:${MURAW_SPOTIFY_REST_API_INTERNAL_PORT}"
    volumes:
      - local__spotify-rest-api__app-logs:/app/logs
    depends_on:
      postgres-master:
        condition: service_healthy
      spotify-liquibase-service:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_SPOTIFY_REST_API_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 1Gb
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - mu__network

  music-data:
    container_name: local__mu-data__app
    restart: unless-stopped
    image: mu-music-data:latest
    environment:
      - JAVA_OPTS=-Xms128m -Xmx384m -XX:MaxMetaspaceSize=96m
    env_file:
      - ../common/music-data.env
      - ./common.env
      - ./music-data.env
      - ./music-data.secrets.env
    ports:
      - "${MU_DATA_APP_EXTERNAL_PORT}:${MU_DATA_APP_INTERNAL_PORT}"
    volumes:
      - local__mu-data__app-logs:/app/logs
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MU_DATA_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.2'
        reservations:
          memory: 256M
          cpus: '0.05'
    networks:
      - mu__network

  art-data:
    container_name: local__art-data__app
    restart: unless-stopped
    image: art-data:latest
    environment:
      - JAVA_OPTS=-Xms128m -Xmx384m -XX:MaxMetaspaceSize=96m
    env_file:
      - ../common/art-data.env
      - ./common.env
      - ./art-data.env
      - ./art-data.secrets.env
    ports:
      - "${ART_DATA_APP_EXTERNAL_PORT}:${ART_DATA_APP_INTERNAL_PORT}"
    volumes:
      - local__art-data__app-logs:/app/logs
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${ART_DATA_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.2'
        reservations:
          memory: 256M
          cpus: '0.05'
    networks:
      - mu__network

  music-quiz:
    container_name: local__mu-quiz__app
    restart: unless-stopped
    image: mu-music-quiz:latest
    environment:
      - JAVA_OPTS=-Xms128m -Xmx384m -XX:MaxMetaspaceSize=96m
    env_file:
      - ../common/music-quiz.env
      - ./common.env
      - ./music-quiz.env
      - ./music-quiz.secrets.env
    ports:
      - "${MU_QUIZ_APP_EXTERNAL_PORT}:${MU_QUIZ_APP_INTERNAL_PORT}"
    volumes:
      - local__mu-quiz__app-logs:/app/logs
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MU_QUIZ_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.05'
    networks:
      - mu__network

  # UI
  art-universe-ui:
    container_name: local__au-ui__app
    restart: unless-stopped
    image: art-universe-ui:latest
    env_file:
      - ./common.env
      - ./art-universe-ui.env
      - ./art-universe-ui.secrets.env
    ports:
      - "${MU_UI_EXTERNAL_PORT}:80"
    depends_on:
      lastfm-rest-api:
        condition: service_healthy
      lastfm-etl-rest-api:
        condition: service_healthy
      music-data:
        condition: service_healthy
      music-quiz:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    networks:
      - mu__network

  # Monitoring
  prometheus:
    container_name: local__mu__prometheus
    image: prom/prometheus:v2.45.6
    restart: unless-stopped
    volumes:
      - ../common/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - local__mu__prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=8h'
      - '--storage.tsdb.retention.size=800MB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT}:9090"
    depends_on:
      lastfm-rest-api:
        condition: service_healthy
      lastfm-etl-rest-api:
        condition: service_healthy
      lastfm-calls-generator:
        condition: service_healthy
      lastfm-calls-performer:
        condition: service_healthy
      lastfm-response-parser:
        condition: service_healthy
      music-data:
        condition: service_healthy
      music-quiz:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1Gb
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.2'
    networks:
      - mu__network

  grafana:
    container_name: local__mu__grafana
    image: grafana/grafana:10.0.13
    restart: unless-stopped
    volumes:
      - local__mu__grafana-data:/var/lib/grafana
      - ../common/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ../common/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.2'
        reservations:
          memory: 96M
          cpus: '0.05'
    networks:
      - mu__network

  # Distributed Tracing
  zipkin:
    container_name: local__mu__zipkin
    image: openzipkin/zipkin:3.4
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem
      - STORAGE_SPAN_RETENTION_PERIOD=28800
      - JAVA_OPTS=-Xms128m -Xmx256m
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - mu__network

networks:
  mu__network:
    name: local__mu__network

volumes:
  local__au__db-postgres-data:
    name: local__au__db-postgres-data
  local__au__db-postgres-replica-data:
    name: local__au__db-postgres-replica-data
  local__spotify-rest-api__app-logs:
    name: local__spotify-rest-api__app-logs
  local__lastfm-rest-api__app-logs:
    name: local__lastfm-rest-api__app-logs
  local__lastfm-etl-rest-api__app-logs:
    name: local__lastfm-etl-rest-api__app-logs
  local__lastfm-calls-generator__app-logs:
    name: local__lastfm-calls-generator__app-logs
  local__lastfm-calls-performer__app-logs:
    name: local__lastfm-calls-performer__app-logs
  local__lastfm-response-parser__app-logs:
    name: local__lastfm-response-parser__app-logs
  local__art-data__app-logs:
    name: local__art-data__app-logs
  local__mu-data__app-logs:
    name: local__mu-data__app-logs
  local__mu-quiz__app-logs:
    name: local__mu-quiz__app-logs
  local__mu__prometheus-data:
    name: local__mu__prometheus-data
  local__mu__grafana-data:
    name: local__mu__grafana-data
