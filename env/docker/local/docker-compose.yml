version: '3.8'

services:
  # Databases
  postgres-lastfm:
    container_name: local__mu-data-raw-lastfm__db-postgres
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 1m
    stop_signal: SIGINT
    build:
      dockerfile: postgres.dockerfile
      context: ../../../music/shared/docker/compose/common
    env_file:
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    volumes:
      - local__mu-data-raw-lastfm__db-postgres-data:/var/lib/postgresql/data
      - ../../../music/data/raw/lastfm-monolith/src/main/resources/docker/compose/common/initdb/templates:/docker-entrypoint-initdb.d
    command: bash -c "envsubst < /docker-entrypoint-initdb.d/init.sql.template > /docker-entrypoint-initdb.d/init.sql && exec docker-entrypoint.sh postgres"
    ports:
      - "${MURAW_LASTFM_DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mu__network

  postgres-music-data:
    container_name: local__mu-music-data__db-postgres
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 1m
    stop_signal: SIGINT
    build:
      dockerfile: postgres.dockerfile
      context: ../../../music/shared/docker/compose/common
    env_file:
      - ./music-data.env
      - ./music-data.secrets.env
      - ./music-quiz.env
      - ./music-quiz.secrets.env
    volumes:
      - local__mu-data__db-postgres-data:/var/lib/postgresql/data
      - ../../../music/shared/docker/compose/common/initdb/templates:/docker-entrypoint-initdb.d
    command: bash -c "envsubst < /docker-entrypoint-initdb.d/init.sql.template > /docker-entrypoint-initdb.d/init.sql && exec docker-entrypoint.sh postgres"
    ports:
      - "${MU_DATA_DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mu__network

  # Migrations
  lastfm-liquibase-service:
    container_name: local__mu-data-raw-lastfm__liquibase
    build:
      dockerfile: Dockerfile.local
      context: ../../../music/data/raw/lastfm/migrations/lastfm-liquibase-service
    env_file:
      - ../common/music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    depends_on:
      postgres-lastfm:
        condition: service_healthy
    networks:
      - mu__network

  # Applications
  music-data-raw-lastfm:
    container_name: local__mu-data-raw-lastfm__app
    restart: unless-stopped
    build:
      dockerfile: Dockerfile.local
      context: ../../../music/data/raw/lastfm-monolith
    env_file:
      - ../common/music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    environment:
      - SPRING_PROFILES_ACTIVE=fast
      - metrics.update.interval=60000
    ports:
      - "${MURAW_LASTFM_APP_EXTERNAL_PORT}:${MURAW_LASTFM_APP_INTERNAL_PORT}"
      - "${MURAW_LASTFM_ACTUATOR_EXTERNAL_PORT}:${MURAW_LASTFM_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - local__mu-data-raw-lastfm__app-logs:/app/logs
      - ../../../music/data/raw/lastfm-monolith/src/main/resources/metrics:/app/src/main/resources/metrics
    depends_on:
      postgres-lastfm:
        condition: service_healthy
      lastfm-liquibase-service:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_LASTFM_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.1'
    networks:
      - mu__network

  lastfm-rest-api:
    container_name: local__mu-data-raw-lastfm-rest-api__app
    restart: unless-stopped
    build:
      dockerfile: Dockerfile.local
      context: ../../../music/data/raw/lastfm/lastfm-rest-api
    env_file:
      - ../common/music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    ports:
      - "${MURAW_LASTFM_REST_API_EXTERNAL_PORT}:${MURAW_LASTFM_REST_API_INTERNAL_PORT}"
      - "${MURAW_LASTFM_REST_API_ACTUATOR_EXTERNAL_PORT}:${MURAW_LASTFM_REST_API_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - local__mu-data-raw-lastfm-rest-api__app-logs:/app/logs
    depends_on:
      postgres-lastfm:
        condition: service_healthy
      lastfm-liquibase-service:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_LASTFM_REST_API_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - mu__network

  lastfm-etl-rest-api:
    container_name: local__mu-data-raw-lastfm-etl-rest-api__app
    restart: unless-stopped
    build:
      dockerfile: Dockerfile.local
      context: ../../../music/data/raw/lastfm/etl/lastfm-etl-rest-api
    env_file:
      - ../common/music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    ports:
      - "${MURAW_LASTFM_ETL_REST_API_EXTERNAL_PORT}:${MURAW_LASTFM_ETL_REST_API_INTERNAL_PORT}"
      - "${MURAW_LASTFM_ETL_REST_API_ACTUATOR_EXTERNAL_PORT}:${MURAW_LASTFM_ETL_REST_API_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - local__mu-data-raw-lastfm-etl-rest-api__app-logs:/app/logs
    depends_on:
      postgres-lastfm:
        condition: service_healthy
      lastfm-liquibase-service:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_LASTFM_ETL_REST_API_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - mu__network

  music-data:
    container_name: local__mu-data__app
    restart: unless-stopped
    build:
      dockerfile: Dockerfile.local
      context: ../../../music/data/master
    env_file:
      - ./music-data.env
      - ./music-data.secrets.env
    environment:
      - SPRING_PROFILES_ACTIVE=fast
    ports:
      - "${MU_DATA_APP_EXTERNAL_PORT}:${MU_DATA_APP_INTERNAL_PORT}"
      - "${MU_DATA_ACTUATOR_EXTERNAL_PORT}:${MU_DATA_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - local__mu-data__app-logs:/app/logs
    depends_on:
      postgres-music-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MU_DATA_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 640M
          cpus: '0.5'
        reservations:
          memory: 384M
          cpus: '0.1'
    networks:
      - mu__network

  music-quiz:
    container_name: local__mu-quiz__app
    restart: unless-stopped
    build:
      dockerfile: Dockerfile.local
      context: ../../../music/quiz
    env_file:
      - ./music-quiz.env
      - ./music-quiz.secrets.env
    environment:
      - SPRING_PROFILES_ACTIVE=fast
    ports:
      - "${MU_QUIZ_APP_EXTERNAL_PORT}:${MU_QUIZ_APP_INTERNAL_PORT}"
      - "${MU_QUIZ_ACTUATOR_EXTERNAL_PORT}:${MU_QUIZ_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - local__mu-quiz__app-logs:/app/logs
    depends_on:
      postgres-music-data:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MU_QUIZ_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.05'
    networks:
      - mu__network

  # UI
  music-universe-ui:
    container_name: local__mu-ui__app
    restart: unless-stopped
    build:
      context: ../../../music/ui
      dockerfile: Dockerfile
      args:
        - VITE_MURAW_LASTFM_APP_HOST=${MURAW_LASTFM_APP_HOST}
        - VITE_MURAW_LASTFM_APP_EXTERNAL_PORT=${MURAW_LASTFM_APP_EXTERNAL_PORT}
        - VITE_MU_DATA_APP_HOST=${MU_DATA_APP_HOST}
        - VITE_MU_DATA_APP_EXTERNAL_PORT=${MU_DATA_APP_EXTERNAL_PORT}
        - VITE_MU_QUIZ_APP_HOST=${MU_QUIZ_APP_HOST}
        - VITE_MU_QUIZ_APP_EXTERNAL_PORT=${MU_QUIZ_APP_EXTERNAL_PORT}
    env_file:
      - ./music-universe-ui.env
      - ./music-universe-ui.secrets.env
    ports:
      - "${MU_UI_EXTERNAL_PORT}:80"
    depends_on:
      music-data-raw-lastfm:
        condition: service_healthy
      music-data:
        condition: service_healthy
      music-quiz:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 32M
          cpus: '0.05'
    networks:
      - mu__network

  # Monitoring
  prometheus:
    container_name: local__mu__prometheus
    image: prom/prometheus:v2.45.6
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - local__mu__prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT}:9090"
    depends_on:
      music-data-raw-lastfm:
        condition: service_healthy
      music-data:
        condition: service_healthy
      music-quiz:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'
        reservations:
          memory: 64M
          cpus: '0.05'
    networks:
      - mu__network

  grafana:
    container_name: local__mu__grafana
    build:
      dockerfile: grafana.dockerfile
      context: ../../../music/data/raw/lastfm-monolith/src/main/resources/docker/compose/common
    restart: unless-stopped
    volumes:
      - local__mu__grafana-data:/var/lib/grafana
      - ../../../music/data/raw/lastfm-monolith/src/main/resources/docker/compose/common/grafana/provisioning/dashboards:/tmp/dashboard-templates
      - ../../../music/data/raw/lastfm-monolith/src/main/resources/docker/compose/common/grafana/provisioning/datasources:/tmp/datasource-templates
      - ../../../music/data/raw/lastfm-monolith/src/main/resources/docker/compose/common/grafana-provision.sh:/tmp/grafana-provision.sh:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - PROMETHEUS_DATASOURCE_UID=${PROMETHEUS_DATASOURCE_UID}
    entrypoint: /tmp/grafana-provision.sh
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: '0.2'
        reservations:
          memory: 96M
          cpus: '0.05'
    networks:
      - mu__network

  # Admin tools
  db-adminer:
    container_name: local__mu__db-adminer
    image: adminer
    restart: unless-stopped
    env_file:
      - ./common.env
    ports:
      - "${DB_ADMINER_PORT}:8080"
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: '0.1'
        reservations:
          memory: 8M
          cpus: '0.01'
    networks:
      - mu__network

networks:
  mu__network:
    name: local__mu__network

volumes:
  local__mu-data-raw-lastfm__db-postgres-data:
    name: local__mu-data-raw-lastfm__db-postgres-data
  local__mu-data__db-postgres-data:
    name: local__mu-data__db-postgres-data
  local__mu-data-raw-lastfm__app-logs:
    name: local__mu-data-raw-lastfm__app-logs
  local__mu-data-raw-lastfm-rest-api__app-logs:
    name: local__mu-data-raw-lastfm-rest-api__app-logs
  local__mu-data-raw-lastfm-etl-rest-api__app-logs:
    name: local__mu-data-raw-lastfm-etl-rest-api__app-logs
  local__mu-data__app-logs:
    name: local__mu-data__app-logs
  local__mu-quiz__app-logs:
    name: local__mu-quiz__app-logs
  local__mu__prometheus-data:
    name: local__mu__prometheus-data
  local__mu__grafana-data:
    name: local__mu__grafana-data
