# Dev environment - databases run in Docker, applications run in IntelliJ
# The stack takes env variables from local env and overrides some of them (mostly ports)
version: '3.8'

services:
  # Databases
  postgres-master:
    container_name: dev__au__db-postgres-master
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 1m
    stop_signal: SIGINT
    image: postgres:14
    env_file:
      - ./database.secrets.env
    volumes:
      - db-postgres-master-data:/var/lib/postgresql/data
      - ../common/db/initdb/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=3", "-c", "max_replication_slots=3", "-c", "wal_keep_size=256"]
    ports:
      - "${AU_DB_MASTER_EXTERNAL_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev__network

  postgres-replica:
    container_name: dev__au__db-postgres-replica
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 1m
    stop_signal: SIGINT
    image: postgres:14
    env_file:
      - ./database.secrets.env
    environment:
      - POSTGRES_MASTER_HOST=postgres-master
      - POSTGRES_MASTER_PORT=5432
      - POSTGRES_REPLICATION_USER=replicator
      - POSTGRES_REPLICATION_PASSWORD=${MURAW_LASTFM_DB_REPLICATION_PASSWORD}
    volumes:
      - db-postgres-replica-data:/var/lib/postgresql/data
      - ../common/db/initdb/replica-entrypoint.sh:/replica-entrypoint.sh
    entrypoint: ["bash", "/replica-entrypoint.sh"]
    ports:
      - "${AU_DB_REPLICA_EXTERNAL_PORT}:5432"
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dev__network

  # Monitoring
  prometheus:
    container_name: dev__mu__prometheus
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT}:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dev__network

  grafana:
    container_name: dev__mu__grafana
    image: grafana/grafana:10.0.13
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ../common/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ../common/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
    networks:
      - dev__network

  # Distributed Tracing
  zipkin:
    container_name: dev__mu__zipkin
    image: openzipkin/zipkin:3.4
    restart: unless-stopped
    ports:
      - "${ZIPKIN_EXTERNAL_PORT}:9411"
    environment:
      - STORAGE_TYPE=mem
      - JAVA_OPTS=-Xms128m -Xmx256m
    depends_on:
      - prometheus
    networks:
      - dev__network

networks:
  dev__network:
    name: dev__network

volumes:
  db-postgres-master-data:
    name: dev__au__db-postgres-data
  db-postgres-replica-data:
    name: dev__au__db-postgres-replica-data
  prometheus-data:
    name: dev__mu__prometheus-data
  grafana-data:
    name: dev__mu__grafana-data
