version: '3.8'

services:
  # Migrations
  au-config-liquibase:
    container_name: prod__au-config__liquibase
    image: au-config-liquibase:latest
    env_file:
      - ./common.env
      - ../common/au-config.env
      - ./au-config.secrets.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mu__network

  spotify-liquibase-service:
    container_name: prod__spotify__liquibase
    image: mu-spotify-liquibase:latest
    env_file:
      - ../common/music-data-raw-spotify.env
      - ./common.env
      - ./music-data-raw-spotify.env
      - ./music-data-raw-spotify.secrets.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mu__network

  lastfm-liquibase-service:
    container_name: prod__lastfm__liquibase
    image: mu-lastfm-liquibase:latest
    env_file:
      - ./common.env
      - ../common/music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mu__network

  # Applications
  au-config-service:
    container_name: prod__au-config-service__app
    restart: unless-stopped
    image: au-config-service:latest
    environment:
      - JAVA_OPTS=-Xms128m -Xmx256m -XX:MaxMetaspaceSize=96m
    env_file:
      - ./common.env
      - ../common/au-config.env
      - ./au-config.env
      - ./au-config.secrets.env
    ports:
      - "${AU_CONFIG_APP_EXTERNAL_PORT}:${AU_CONFIG_APP_INTERNAL_PORT}"
    volumes:
      - prod__au-config-service__app-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      au-config-liquibase:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${AU_CONFIG_APP_INTERNAL_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.2'
        reservations:
          memory: 128M
          cpus: '0.05'
    networks:
      - mu__network

  spotify-rest-api:
    container_name: prod__spotify-rest-api__app
    restart: unless-stopped
    image: mu-spotify-rest-api:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-spotify.env
      - ./common.env
      - ./music-data-raw-spotify.env
      - ./music-data-raw-spotify.secrets.env
    ports:
      - "${MURAW_SPOTIFY_REST_API_EXTERNAL_PORT}:${MURAW_SPOTIFY_REST_API_INTERNAL_PORT}"
    volumes:
      - prod__spotify-rest-api__app-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      spotify-liquibase-service:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_SPOTIFY_REST_API_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 1Gb
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - mu__network

  spotify-calls-generator:
    container_name: prod__spotify-calls-generator__app
    restart: unless-stopped
    stop_grace_period: 1m
    image: mu-spotify-calls-generator:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-spotify.env
      - ../common/music-data-raw-spotify-etl.env
      - ../common/au-config.env
      - ./common.env
      - ./music-data-raw-spotify.secrets.env
    ports:
      - "${MURAW_SPOTIFY_CALLS_GENERATOR_ACTUATOR_EXTERNAL_PORT}:${MURAW_SPOTIFY_CALLS_GENERATOR_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - prod__spotify-calls-generator__app-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      spotify-liquibase-service:
        condition: service_completed_successfully
      au-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_SPOTIFY_CALLS_GENERATOR_ACTUATOR_INTERNAL_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 1Gb
          cpus: '0.2'
        reservations:
          memory: 256M
          cpus: '0.05'
    networks:
      - mu__network

  spotify-calls-performer:
    container_name: prod__spotify-calls-performer__app
    restart: unless-stopped
    stop_grace_period: 1m
    image: mu-spotify-calls-performer:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-spotify.env
      - ../common/music-data-raw-spotify-etl.env
      - ../common/au-config.env
      - ./common.env
      - ./music-data-raw-spotify.secrets.env
    ports:
      - "${MURAW_SPOTIFY_CALLS_PERFORMER_ACTUATOR_EXTERNAL_PORT}:${MURAW_SPOTIFY_CALLS_PERFORMER_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - prod__spotify-calls-performer__app-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      spotify-liquibase-service:
        condition: service_completed_successfully
      spotify-calls-generator:
        condition: service_healthy
      au-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_SPOTIFY_CALLS_PERFORMER_ACTUATOR_INTERNAL_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 1Gb
          cpus: '0.2'
        reservations:
          memory: 256M
          cpus: '0.05'
    networks:
      - mu__network

  spotify-response-parser:
    container_name: prod__spotify-response-parser__app
    restart: unless-stopped
    stop_grace_period: 1m
    image: mu-spotify-response-parser:latest
    environment:
