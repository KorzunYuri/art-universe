    deploy:
      resources:
        limits:
          memory: 1Gb
          cpus: '0.2'
        reservations:
          memory: 256M
          cpus: '0.05'
    networks:
      - mu__network

  lastfm-rest-api:
    container_name: prod__lastfm-rest-api__app
    restart: unless-stopped
    image: mu-lastfm-rest-api:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-lastfm.env
