version: '3.8'

services:
  # Applications
  music-data-raw-lastfm:
    container_name: prod__mu-data-raw-lastfm__app
    restart: unless-stopped
    build:
      context: ../../../music-universe/music-data-raw-lastfm
      dockerfile: Dockerfile
    env_file:
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    environment:
      - SPRING_PROFILES_ACTIVE=fast
    ports:
      - "${MURAW_LASTFM_APP_EXTERNAL_PORT}:${MURAW_LASTFM_APP_INTERNAL_PORT}"
      - "${MURAW_LASTFM_ACTUATOR_EXTERNAL_PORT}:${MURAW_LASTFM_ACTUATOR_INTERNAL_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_LASTFM_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - mu__network

  music-data:
    container_name: prod__mu-data__app
    restart: unless-stopped
    build:
      context: ../../../music-universe/music-data
      dockerfile: Dockerfile
    env_file:
      - ./music-data.env
      - ./music-data.secrets.env
    environment:
      - SPRING_PROFILES_ACTIVE=fast
    ports:
      - "${MU_DATA_APP_EXTERNAL_PORT}:${MU_DATA_APP_INTERNAL_PORT}"
      - "${MU_DATA_ACTUATOR_EXTERNAL_PORT}:${MU_DATA_ACTUATOR_INTERNAL_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MU_DATA_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - mu__network

  music-quiz:
    container_name: prod__mu-quiz__app
    restart: unless-stopped
    build:
      context: ../../../music-universe/music-quiz
      dockerfile: Dockerfile
    env_file:
      - ./music-quiz.env
      - ./music-quiz.secrets.env
    environment:
      - SPRING_PROFILES_ACTIVE=fast
    ports:
      - "${MU_QUIZ_APP_EXTERNAL_PORT}:${MU_QUIZ_APP_INTERNAL_PORT}"
      - "${MU_QUIZ_ACTUATOR_EXTERNAL_PORT}:${MU_QUIZ_ACTUATOR_INTERNAL_PORT}"
    depends_on:
      music-data:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MU_QUIZ_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - mu__network

  # UI
  music-universe-ui:
    container_name: prod__mu-ui__app
    restart: unless-stopped
    build:
      context: ../../../music-universe/music-universe-ui
      dockerfile: Dockerfile
      args:
        - VITE_MURAW_LASTFM_APP_HOST=${MURAW_LASTFM_APP_HOST}
        - VITE_MURAW_LASTFM_APP_EXTERNAL_PORT=${MURAW_LASTFM_APP_EXTERNAL_PORT}
        - VITE_MU_DATA_APP_HOST=${MU_DATA_APP_HOST}
        - VITE_MU_DATA_APP_EXTERNAL_PORT=${MU_DATA_APP_EXTERNAL_PORT}
        - VITE_MU_QUIZ_APP_HOST=${MU_QUIZ_APP_HOST}
        - VITE_MU_QUIZ_APP_EXTERNAL_PORT=${MU_QUIZ_APP_EXTERNAL_PORT}
    env_file:
      - ./music-universe-ui.env
    ports:
      - "${MU_UI_EXTERNAL_PORT}:80"
    depends_on:
      music-data-raw-lastfm:
        condition: service_healthy
      music-data:
        condition: service_healthy
      music-quiz:
        condition: service_healthy
    networks:
      - mu__network

  # Admin tools
  db-adminer:
    container_name: prod__mu__db-adminer
    image: adminer
    restart: unless-stopped
    env_file:
      - ./common.env
    ports:
      - "${DB_ADMINER_PORT}:8080"
    networks:
      - mu__network

networks:
  mu__network:
    name: prod__mu__network
