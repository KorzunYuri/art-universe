      - ./music-data-raw-spotify.secrets.env
    ports:
      - "${MURAW_SPOTIFY_RESPONSE_PARSER_ACTUATOR_EXTERNAL_PORT}:${MURAW_SPOTIFY_RESPONSE_PARSER_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - prod__spotify-response-parser__app-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
