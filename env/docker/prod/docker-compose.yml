      au-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_SPOTIFY_RESPONSE_PARSER_ACTUATOR_INTERNAL_PORT}/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 600s
    deploy:
      resources:
        limits:
          memory: 2Gb
          cpus: '0.3'
        reservations:
          memory: 256M
          cpus: '0.1'
    networks:
      - mu__network

  spotify-staging-applicator:
    container_name: prod__spotify-staging-applicator__app
    restart: unless-stopped
    stop_grace_period: 1m
    image: mu-spotify-staging-applicator:latest
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m
    env_file:
      - ../common/music-data-raw-spotify.env
      - ../common/music-data-raw-spotify-etl.env
      - ../common/au-config.env
