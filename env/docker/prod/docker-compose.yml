version: '3.8'

services:
  # Applications
  music-data-raw-lastfm:
    container_name: prod__mu-data-raw-lastfm__app
    restart: unless-stopped
    build:
      context: ../../../
      dockerfile: music-universe/music-data-raw-lastfm/Dockerfile.prod
    env_file:
      - ./music-data-raw-lastfm.env
      - ./music-data-raw-lastfm.secrets.env
    environment:
      - SPRING_PROFILES_ACTIVE=fast
      - metrics.update.interval=60000
    ports:
      - "${MURAW_LASTFM_APP_EXTERNAL_PORT}:${MURAW_LASTFM_APP_INTERNAL_PORT}"
      - "${MURAW_LASTFM_ACTUATOR_EXTERNAL_PORT}:${MURAW_LASTFM_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - prod__mu-data-raw-lastfm__app-logs:/app/logs
      - ../../../music-universe/music-data-raw-lastfm/src/main/resources/metrics:/app/src/main/resources/metrics
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_LASTFM_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - mu__network

  music-data:
    container_name: prod__mu-data__app
    restart: unless-stopped
    build:
      context: ../../../
      dockerfile: music-universe/music-data/Dockerfile.prod
    env_file:
      - ./music-data.env
      - ./music-data.secrets.env
    environment:
      - SPRING_PROFILES_ACTIVE=fast
    ports:
      - "${MU_DATA_APP_EXTERNAL_PORT}:${MU_DATA_APP_INTERNAL_PORT}"
      - "${MU_DATA_ACTUATOR_EXTERNAL_PORT}:${MU_DATA_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - prod__mu-data__app-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MU_DATA_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - mu__network

  music-quiz:
    container_name: prod__mu-quiz__app
    restart: unless-stopped
    build:
      context: ../../../
      dockerfile: music-universe/music-quiz/Dockerfile.prod
    env_file:
      - ./music-quiz.env
      - ./music-quiz.secrets.env
    environment:
      - SPRING_PROFILES_ACTIVE=fast
    ports:
      - "${MU_QUIZ_APP_EXTERNAL_PORT}:${MU_QUIZ_APP_INTERNAL_PORT}"
      - "${MU_QUIZ_ACTUATOR_EXTERNAL_PORT}:${MU_QUIZ_ACTUATOR_INTERNAL_PORT}"
    volumes:
      - prod__mu-quiz__app-logs:/app/logs
    depends_on:
      music-data:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MU_QUIZ_APP_INTERNAL_PORT}/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - mu__network

  # UI
  music-universe-ui:
    container_name: prod__mu-ui__app
    restart: unless-stopped
    build:
      context: ../../../music-universe/music-universe-ui
      dockerfile: Dockerfile
      args:
        - VITE_MURAW_LASTFM_APP_HOST=${MURAW_LASTFM_APP_HOST}
        - VITE_MURAW_LASTFM_APP_EXTERNAL_PORT=${MURAW_LASTFM_APP_EXTERNAL_PORT}
        - VITE_MU_DATA_APP_HOST=${MU_DATA_APP_HOST}
        - VITE_MU_DATA_APP_EXTERNAL_PORT=${MU_DATA_APP_EXTERNAL_PORT}
        - VITE_MU_QUIZ_APP_HOST=${MU_QUIZ_APP_HOST}
        - VITE_MU_QUIZ_APP_EXTERNAL_PORT=${MU_QUIZ_APP_EXTERNAL_PORT}
    env_file:
      - ./music-universe-ui.env
      - ./music-universe-ui.secrets.env
    ports:
      - "${MU_UI_EXTERNAL_PORT}:80"
    depends_on:
      music-data-raw-lastfm:
        condition: service_healthy
      music-data:
        condition: service_healthy
      music-quiz:
        condition: service_healthy
    networks:
      - mu__network

  # Monitoring
  prometheus:
    container_name: prod__mu__prometheus
    image: prom/prometheus:v2.45.6
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prod__mu__prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "${PROMETHEUS_PORT}:9090"
    depends_on:
      music-data-raw-lastfm:
        condition: service_healthy
      music-data:
        condition: service_healthy
      music-quiz:
        condition: service_healthy
    networks:
      - mu__network

  grafana:
    container_name: prod__mu__grafana
    build:
      dockerfile: grafana.dockerfile
      context: ../../../music-universe/music-data-raw-lastfm/src/main/resources/docker/compose/common
    restart: unless-stopped
    volumes:
      - prod__mu__grafana-data:/var/lib/grafana
      - ../../../music-universe/music-data-raw-lastfm/src/main/resources/docker/compose/common/grafana/provisioning/dashboards:/tmp/dashboard-templates
      - ../../../music-universe/music-data-raw-lastfm/src/main/resources/docker/compose/common/grafana/provisioning/datasources:/tmp/datasource-templates
      - ../../../music-universe/music-data-raw-lastfm/src/main/resources/docker/compose/common/grafana-provision.sh:/tmp/grafana-provision.sh
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - PROMETHEUS_DATASOURCE_UID=${PROMETHEUS_DATASOURCE_UID}
    entrypoint: /tmp/grafana-provision.sh
    ports:
      - "${GRAFANA_PORT}:3000"
    depends_on:
      - prometheus
    networks:
      - mu__network

  # Admin tools
  db-adminer:
    container_name: prod__mu__db-adminer
    image: adminer
    restart: unless-stopped
    env_file:
      - ./common.env
    ports:
      - "${DB_ADMINER_PORT}:8080"
    networks:
      - mu__network

networks:
  mu__network:
    name: prod__mu__network

volumes:
  prod__mu-data-raw-lastfm__app-logs:
    name: prod__mu-data-raw-lastfm__app-logs
  prod__mu-data__app-logs:
    name: prod__mu-data__app-logs
  prod__mu-quiz__app-logs:
    name: prod__mu-quiz__app-logs
  prod__mu__prometheus-data:
    name: prod__mu__prometheus-data
  prod__mu__grafana-data:
    name: prod__mu__grafana-data
