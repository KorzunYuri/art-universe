    volumes:
      - prod__spotify-staging-applicator__app-logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      spotify-liquibase-service:
        condition: service_completed_successfully
      spotify-response-parser:
        condition: service_healthy
      au-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MURAW_SPOTIFY_STAGING_APPLICATOR_ACTUATOR_INTERNAL_PORT}/actuator/health"]
      interval: 10s
