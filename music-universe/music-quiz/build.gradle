plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.liquibase.gradle'
}

tasks.matching { it.name == 'jar' }.configureEach { enabled = true }
tasks.matching { it.name == 'bootJar' }.configureEach { enabled = true }

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
    dependencies {
        dependency "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openapiVersion}"
        dependency "org.liquibase:liquibase-core:${liquibaseVersion}"
        dependency "org.projectlombok:lombok:${lombokVersion}"
    }
}

dependencies {
    implementation project(':art-universe:art-universe-commons')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    
    implementation 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'

    implementation 'org.springframework.boot:spring-boot-docker-compose'
}
