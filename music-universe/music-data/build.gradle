plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.liquibase.gradle'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
    dependencies {
        dependency "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openapiVersion}"
        dependency "org.liquibase:liquibase-core:${liquibaseVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'  // Added for Jakarta Bean Validation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'

    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'

    implementation 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation project(':art-universe:art-universe-commons')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.hibernate.validator:hibernate-validator'  // Added explicit dependency for tests

}
