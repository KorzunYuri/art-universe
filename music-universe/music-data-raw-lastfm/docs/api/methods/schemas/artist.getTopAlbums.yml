# LastFM API Response Schema: artist.getTopAlbums
# Purpose: Get top albums for a specific artist

response_structure:
  root_key: "topalbums"
  
  main_entity:
    type: "album_collection"
    description: "Collection of top albums for an artist"

  attributes:
    - name: "@attr.artist"
      type: "string"
      required: true
      description: "Artist name"
      processing: ignored
    - name: "@attr.page"
      type: "string"
      required: false
      description: "Current page number"
      processing: ignored
    - name: "@attr.perPage"
      type: "string"
      required: false
      description: "Items per page"
      processing: ignored
    - name: "@attr.totalPages"
      type: "string"
      required: false
      description: "Total pages available"
      processing: ignored
    - name: "@attr.total"
      type: "string"
      required: false
      description: "Total albums count"
      processing: ignored

  nested_entities:
    albums:
      path: "album"
      type: "array"
      entity_type: "album"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Album name"
        - name: "mbid"
          type: "string"
          required: false
          description: "MusicBrainz ID"
        - name: "playcount"
          type: "string"  # Note: comes as string from API
          required: true
          description: "Album play count"
        - name: "url"
          type: "string"
          required: true
          description: "LastFM URL for the album"

    artist_info:
      path: "album[].artist"
      type: "object"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Artist name"
        - name: "mbid"
          type: "string"
          required: false
          description: "Artist MusicBrainz ID"
        - name: "url"
          type: "string"
          required: true
          description: "Artist LastFM URL"

    images:
      path: "album[].image"
      type: "array"
      entity_type: "image"
      processing: ignored
      fields:
        - name: "#text"
          type: "string"
          required: true
          description: "Image URL"
        - name: "size"
          type: "string"
          required: true
          description: "Image size (small, medium, large, extralarge, mega)"

processing_notes:
  - "Extract album entities with artist relationships"
  - "Use playcount to determine album popularity"
  - "Filter albums by minimum playcount threshold"
  - "Create or update album entities"
  - "Ensure artist-album relationships are established"

thresholds:
  - field: "playcount"
    min_value: 10000
    description: "Minimum album play count for processing"

relationship_creation:
  - type: "artist_album"
    source: "@attr.artist"
    target: "albums"
    description: "Create artist-album relationships"

special_handling:
  - "Convert playcount from string to numeric"
  - "Handle pagination attributes for potential follow-up calls"
  - "Ensure artist entity exists before creating album relationships"
