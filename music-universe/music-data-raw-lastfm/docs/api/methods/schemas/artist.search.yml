# LastFM API Response Schema: artist.search
# Purpose: Search for artists by name

response_structure:
  root_key: "results"
  
  main_entity:
    type: "search_results"
    description: "Search results for artist query"

  search_metadata:
    - name: "opensearch:Query.#text"
      type: "string"
      required: false
      description: "Original search query text"
      processing: ignored
    - name: "opensearch:Query.searchTerms"
      type: "string"
      required: true
      description: "Search terms used"
      processing: ignored
    - name: "opensearch:Query.startPage"
      type: "string"
      required: false
      description: "Starting page number"
      processing: ignored
    - name: "opensearch:totalResults"
      type: "string"
      required: true
      description: "Total number of results"
      processing: ignored
    - name: "opensearch:startIndex"
      type: "string"
      required: false
      description: "Starting index"
      processing: ignored
    - name: "opensearch:itemsPerPage"
      type: "string"
      required: false
      description: "Items per page"
      processing: ignored

  nested_entities:
    artists:
      path: "artistmatches.artist"
      type: "array"
      entity_type: "artist"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Artist name"
        - name: "mbid"
          type: "string"
          required: false
          description: "MusicBrainz ID"
        - name: "listeners"
          type: "string"  # Note: comes as string from API
          required: true
          description: "Total listeners count"
        - name: "url"
          type: "string"
          required: true
          description: "LastFM URL for the artist"
        - name: "streamable"
          type: "string"
          required: false
          description: "Whether artist is streamable (0/1)"
          processing: ignored

    images:
      path: "artistmatches.artist[].image"
      type: "array"
      entity_type: "image"
      processing: ignored
      fields:
        - name: "#text"
          type: "string"
          required: true
          description: "Image URL"
        - name: "size"
          type: "string"
          required: true
          description: "Image size (small, medium, large, extralarge, mega)"

processing_notes:
  - "Extract artist entities from search results"
  - "Use listeners count to determine artist popularity"
  - "Filter artists by minimum listeners threshold"
  - "Calculate similarity score against original search terms"
  - "Create or update artist entities"

thresholds:
  - field: "listeners"
    min_value: 1000
    description: "Minimum listeners count for artist processing"

similarity_matching:
  - field: "name"
    against: "opensearch:Query.searchTerms"
    min_similarity: 0.5
    description: "Minimum name similarity for processing"

special_handling:
  - "Convert listeners from string to numeric"
  - "Calculate name similarity against search terms"
  - "Handle pagination metadata for potential follow-up calls"
  - "Filter results by similarity threshold to avoid irrelevant matches"
