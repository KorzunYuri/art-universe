# LastFM API Response Schema: tag.getTopTags
# Purpose: Get list of top tags from LastFM

response_structure:
  root_key: "toptags"
  
  main_entity:
    type: "tag_collection"
    description: "Collection of top tags from LastFM"

  attributes:
    - name: "@attr.offset"
      type: "integer"
      required: false
      description: "Offset for pagination"
      processing: ignored
    - name: "@attr.num_res"
      type: "integer"
      required: false
      description: "Number of results returned"
      processing: ignored
    - name: "@attr.total"
      type: "integer"
      required: false
      description: "Total number of tags available"
      processing: ignored

  nested_entities:
    tags:
      path: "tag"
      type: "array"
      entity_type: "tag"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Tag name"
        - name: "count"
          type: "integer"
          required: true
          description: "Total usage count of the tag"
        - name: "reach"
          type: "integer"
          required: true
          description: "Number of unique users who have used this tag"

processing_notes:
  - "Extract tag entities with usage statistics"
  - "Use count and reach to determine tag importance"
  - "Filter tags by minimum usage threshold"
  - "Create or update tag entities"
  - "This is typically the entry point for tag discovery"

thresholds:
  - field: "count"
    min_value: 1000
    description: "Minimum usage count for tag processing"

special_handling:
  - "Handle pagination using offset attribute"
  - "Use count and reach for tag popularity scoring"
  - "This method doesn't provide URLs, so construct them from tag names"
  - "Primary source for discovering new tags in the system"

url_construction:
  - pattern: "https://www.last.fm/tag/{tag_name_encoded}"
    description: "Construct LastFM URLs for tags since they're not provided in response"
