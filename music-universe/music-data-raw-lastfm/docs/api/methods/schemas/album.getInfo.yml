# LastFM API Response Schema: album.getInfo
# Purpose: Get detailed information about a specific album

response_structure:
  root_key: "album"
  
  main_entity:
    type: "album"
    fields:
      - name: "artist"
        type: "string"
        required: true
        description: "Album artist name"
      - name: "mbid" 
        type: "string"
        required: false
        description: "MusicBrainz ID"
      - name: "name"
        type: "string"
        required: true
        description: "Album name"
      - name: "playcount"
        type: "string"  # Note: comes as string from API
        required: true
        description: "Total play count"
      - name: "listeners"
        type: "string"  # Note: comes as string from API
        required: false
        description: "Total listeners count"
      - name: "url"
        type: "string"
        required: true
        description: "LastFM URL for the album"

  nested_entities:
    tags:
      path: "tags.tag"
      type: "array"
      entity_type: "tag"
      fields:
        - name: "name"
          type: "string"
          required: true
        - name: "url"
          type: "string"
          required: true
    
    images:
      path: "image"
      type: "array"
      entity_type: "image"
      processing: ignored
      fields:
        - name: "#text"
          type: "string"
          required: true
          description: "Image URL"
        - name: "size"
          type: "string"
          required: true
          description: "Image size (small, medium, large, extralarge, mega)"

    tracks:
      path: "tracks.track"
      type: "array"
      entity_type: "track"
      fields:
        - name: "name"
          type: "string"
          required: true
        - name: "url"
          type: "string"
          required: true
        - name: "duration"
          type: "string"
          required: false
        - name: "@attr.rank"
          type: "string"
          required: false
          description: "Track position in album"

processing_notes:
  - "Extract album entity with artist relationship"
  - "Create tag relationships for album"
  - "Extract track entities with album relationship"
  - "Store image URLs for different sizes"
  - "Convert playcount/listeners from string to numeric"

thresholds:
  - field: "playcount"
    min_value: 10000
    description: "Minimum play count for album approval"
