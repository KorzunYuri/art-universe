# LastFM API Response Schema: album.getTopTags
# Purpose: Get top tags for a specific album

response_structure:
  root_key: "toptags"
  
  main_entity:
    type: "tag_collection"
    description: "Collection of tags associated with an album"

  nested_entities:
    tags:
      path: "tag"
      type: "array"
      entity_type: "tag"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Tag name"
        - name: "url"
          type: "string"
          required: true
          description: "LastFM URL for the tag"
        - name: "count"
          type: "integer"
          required: true
          description: "Usage count for this tag on this album"

  attributes:
    - name: "@attr.artist"
      type: "string"
      required: false
      description: "Artist name (if present in attributes)"
    - name: "@attr.album"
      type: "string"
      required: false
      description: "Album name (if present in attributes)"

processing_notes:
  - "Extract tag entities and create album-tag relationships"
  - "Use count field to determine tag relevance/weight"
  - "Filter tags based on usage count threshold"
  - "Create or update existing tag entities"

thresholds:
  - field: "count"
    min_value: 10
    description: "Minimum tag usage count for processing"

relationship_creation:
  - type: "album_tag"
    source: "album_entity_id"
    target: "tag_entity"
    weight_field: "count"
