# LastFM API Response Schema: tag.getTopArtists
# Purpose: Get top artists for a specific tag

response_structure:
  root_key: "topartists"
  
  main_entity:
    type: "artist_collection"
    description: "Collection of top artists for a tag"

  attributes:
    - name: "@attr.tag"
      type: "string"
      required: true
      description: "Tag name"
      processing: ignored
    - name: "@attr.page"
      type: "string"
      required: false
      description: "Current page number"
      processing: ignored
    - name: "@attr.perPage"
      type: "string"
      required: false
      description: "Items per page"
      processing: ignored
    - name: "@attr.totalPages"
      type: "string"
      required: false
      description: "Total pages available"
      processing: ignored
    - name: "@attr.total"
      type: "string"
      required: false
      description: "Total artists count"
      processing: ignored

  nested_entities:
    artists:
      path: "artist"
      type: "array"
      entity_type: "artist"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Artist name"
        - name: "mbid"
          type: "string"
          required: false
          description: "MusicBrainz ID"
        - name: "url"
          type: "string"
          required: true
          description: "LastFM URL for the artist"
        - name: "streamable"
          type: "string"
          required: false
          description: "Whether artist is streamable (0/1)"
          processing: ignored
        - name: "@attr.rank"
          type: "string"
          required: false
          description: "Artist rank in tag's top artists"

    images:
      path: "artist[].image"
      type: "array"
      entity_type: "image"
      processing: ignored
      fields:
        - name: "#text"
          type: "string"
          required: true
          description: "Image URL"
        - name: "size"
          type: "string"
          required: true
          description: "Image size (small, medium, large, extralarge, mega)"

processing_notes:
  - "Extract artist entities from tag's top artists"
  - "Create tag-artist relationships"
  - "Use rank to determine artist importance within tag"
  - "Create or update artist entities"
  - "Ensure tag entity exists before creating relationships"

relationship_creation:
  - type: "tag_artist"
    source: "@attr.tag"
    target: "artists"
    weight_field: "@attr.rank"
    description: "Create tag-artist relationships with ranking"

special_handling:
  - "Handle pagination attributes for potential follow-up calls"
  - "Use rank for relationship weight (lower rank = higher importance)"
  - "Ensure tag entity exists before creating artist relationships"
  - "Handle streamable field as boolean"
