apply plugin: "org.springframework.boot"
apply plugin: "org.liquibase.gradle"

tasks.matching { it.name == 'jar' }.configureEach { enabled = true }
tasks.matching { it.name == 'bootJar' }.configureEach { enabled = true }

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation "org.liquibase:liquibase-core:${liquibaseVersion}"
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63:3.9.3' // for jsonb persistence

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "org.testcontainers:postgresql:${testContainersPostgreVersion}"
}
