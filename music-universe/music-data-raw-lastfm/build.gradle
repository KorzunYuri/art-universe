plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'org.liquibase.gradle'
}

tasks.matching { it.name == 'jar' }.configureEach { enabled = true }
tasks.matching { it.name == 'bootJar' }.configureEach { enabled = true }

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
    dependencies {
        dependency "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openapiVersion}"
        dependency "org.liquibase:liquibase-core:${liquibaseVersion}"
        dependency "com.google.guava:guava:33.4.0-jre"
        dependency "info.debatty:java-string-similarity:2.0.0"
        dependency "io.hypersistence:hypersistence-utils-hibernate-63:3.9.3"
    }
}

dependencies {
    implementation project(':art-universe:art-universe-commons')
    
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    implementation 'com.google.guava:guava'
    implementation 'info.debatty:java-string-similarity'

    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'io.hypersistence:hypersistence-utils-hibernate-63' // for jsonb persistence

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:postgresql'

    implementation 'org.springframework.boot:spring-boot-docker-compose'
}
