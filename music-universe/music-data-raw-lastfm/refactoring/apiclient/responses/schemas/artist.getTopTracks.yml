# LastFM API Response Schema: artist.getTopTracks
# Purpose: Get top tracks for a specific artist

response_structure:
  root_key: "toptracks"
  
  main_entity:
    type: "track_collection"
    description: "Collection of top tracks for an artist"

  attributes:
    - name: "@attr.artist"
      type: "string"
      required: true
      description: "Artist name"
      processing: ignored
    - name: "@attr.page"
      type: "string"
      required: false
      description: "Current page number"
      processing: ignored
    - name: "@attr.perPage"
      type: "string"
      required: false
      description: "Items per page"
      processing: ignored
    - name: "@attr.totalPages"
      type: "string"
      required: false
      description: "Total pages available"
      processing: ignored
    - name: "@attr.total"
      type: "string"
      required: false
      description: "Total tracks count"
      processing: ignored

  nested_entities:
    tracks:
      path: "track"
      type: "array"
      entity_type: "track"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Track name"
        - name: "mbid"
          type: "string"
          required: false
          description: "MusicBrainz ID"
        - name: "playcount"
          type: "string"  # Note: comes as string from API
          required: true
          description: "Track play count"
        - name: "listeners"
          type: "string"  # Note: comes as string from API
          required: true
          description: "Track listeners count"
        - name: "url"
          type: "string"
          required: true
          description: "LastFM URL for the track"
        - name: "@attr.rank"
          type: "string"
          required: false
          description: "Track rank in top tracks list"

    artist_info:
      path: "track[].artist"
      type: "object"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Artist name"
        - name: "mbid"
          type: "string"
          required: false
          description: "Artist MusicBrainz ID"
        - name: "url"
          type: "string"
          required: true
          description: "Artist LastFM URL"

    images:
      path: "track[].image"
      type: "array"
      entity_type: "image"
      processing: ignored
      fields:
        - name: "#text"
          type: "string"
          required: true
          description: "Image URL"
        - name: "size"
          type: "string"
          required: true
          description: "Image size (small, medium, large, extralarge, mega)"

processing_notes:
  - "Extract track entities with artist relationships"
  - "Use playcount and listeners to determine track popularity"
  - "Filter tracks by minimum listeners threshold"
  - "Create or update track entities"
  - "Ensure artist-track relationships are established"

thresholds:
  - field: "listeners"
    min_value: 1000
    description: "Minimum track listeners count for processing"

relationship_creation:
  - type: "artist_track"
    source: "@attr.artist"
    target: "tracks"
    description: "Create artist-track relationships"

special_handling:
  - "Convert playcount and listeners from string to numeric"
  - "Handle pagination attributes for potential follow-up calls"
  - "Use rank attribute to determine track importance"
  - "Ensure artist entity exists before creating track relationships"
