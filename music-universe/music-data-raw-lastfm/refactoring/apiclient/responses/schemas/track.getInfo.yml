# LastFM API Response Schema: track.getInfo
# Purpose: Get detailed information about a specific track

response_structure:
  root_key: "track"
  
  main_entity:
    type: "track"
    fields:
      - name: "name"
        type: "string"
        required: true
        description: "Track name"
      - name: "mbid"
        type: "string"
        required: false
        description: "MusicBrainz ID"
      - name: "url"
        type: "string"
        required: true
        description: "LastFM URL for the track"
      - name: "duration"
        type: "string"
        required: false
        description: "Track duration in milliseconds"
      - name: "listeners"
        type: "string"  # Note: comes as string from API
        required: true
        description: "Total listeners count"
      - name: "playcount"
        type: "string"  # Note: comes as string from API
        required: true
        description: "Total play count"

  nested_entities:
    artist_info:
      path: "artist"
      type: "object"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Artist name"
        - name: "mbid"
          type: "string"
          required: false
          description: "Artist MusicBrainz ID"
        - name: "url"
          type: "string"
          required: true
          description: "Artist LastFM URL"

    album_info:
      path: "album"
      type: "object"
      fields:
        - name: "artist"
          type: "string"
          required: true
          description: "Album artist name"
        - name: "title"
          type: "string"
          required: true
          description: "Album title"
        - name: "mbid"
          type: "string"
          required: false
          description: "Album MusicBrainz ID"
        - name: "url"
          type: "string"
          required: true
          description: "Album LastFM URL"
        - name: "@attr.position"
          type: "string"
          required: false
          description: "Track position in album"

    album_images:
      path: "album.image"
      type: "array"
      entity_type: "image"
      processing: ignored
      fields:
        - name: "#text"
          type: "string"
          required: true
          description: "Image URL"
        - name: "size"
          type: "string"
          required: true
          description: "Image size (small, medium, large, extralarge, mega)"

    tags:
      path: "toptags.tag"
      type: "array"
      entity_type: "tag"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Tag name"
        - name: "url"
          type: "string"
          required: true
          description: "LastFM URL for the tag"

    streamable_info:
      path: "streamable"
      type: "object"
      processing: ignored
      fields:
        - name: "#text"
          type: "string"
          required: false
          description: "Whether track is streamable (0/1)"
        - name: "fulltrack"
          type: "string"
          required: false
          description: "Whether full track is streamable (0/1)"

    wiki:
      path: "wiki"
      type: "object"
      processing: ignored
      fields:
        - name: "published"
          type: "string"
          required: false
          description: "Wiki publication date"
          processing: ignored
        - name: "summary"
          type: "string"
          required: false
          description: "Short track description"
          processing: ignored
        - name: "content"
          type: "string"
          required: false
          description: "Full track description"
          processing: ignored

processing_notes:
  - "Extract track entity with artist and album relationships"
  - "Create tag relationships for track"
  - "Use listeners and playcount to determine track popularity"
  - "Convert numeric fields from string to appropriate types"

thresholds:
  - field: "listeners"
    min_value: 1000
    description: "Minimum listeners count for track processing"

relationship_creation:
  - type: "artist_track"
    source: "artist"
    target: "track"
    description: "Create artist-track relationship"
  - type: "album_track"
    source: "album"
    target: "track"
    position_field: "album.@attr.position"
    description: "Create album-track relationship with position"
  - type: "track_tag"
    source: "track"
    target: "tags"
    description: "Create track-tag relationships"

special_handling:
  - "Convert duration, listeners, playcount from string to numeric"
  - "Handle streamable object with nested properties"
  - "Use album position for track ordering within album"
  - "Ensure artist and album entities exist before creating track relationships"
