# LastFM API Response Schema: artist.getInfo
# Purpose: Get detailed information about a specific artist

response_structure:
  root_key: "artist"
  
  main_entity:
    type: "artist"
    fields:
      - name: "name"
        type: "string"
        required: true
        description: "Artist name"
      - name: "mbid"
        type: "string"
        required: false
        description: "MusicBrainz ID"
      - name: "url"
        type: "string"
        required: true
        description: "LastFM URL for the artist"
      - name: "streamable"
        type: "string"
        required: false
        description: "Whether artist is streamable (0/1)"
        processing: ignored
      - name: "ontour"
        type: "string"
        required: false
        description: "Whether artist is currently on tour (0/1)"
        processing: ignored

  nested_entities:
    stats:
      path: "stats"
      type: "object"
      fields:
        - name: "listeners"
          type: "string"  # Note: comes as string from API
          required: true
          description: "Total listeners count"
        - name: "playcount"
          type: "string"  # Note: comes as string from API
          required: true
          description: "Total play count"

    similar_artists:
      path: "similar.artist"
      type: "array"
      entity_type: "artist"
      fields:
        - name: "name"
          type: "string"
          required: true
        - name: "url"
          type: "string"
          required: true
        - name: "mbid"
          type: "string"
          required: false

    tags:
      path: "tags.tag"
      type: "array"
      entity_type: "tag"
      fields:
        - name: "name"
          type: "string"
          required: true
        - name: "url"
          type: "string"
          required: true

    images:
      path: "image"
      type: "array"
      entity_type: "image"
      processing: ignored
      fields:
        - name: "#text"
          type: "string"
          required: true
          description: "Image URL"
        - name: "size"
          type: "string"
          required: true
          description: "Image size (small, medium, large, extralarge, mega, '')"

    bio:
      path: "bio"
      type: "object"
      processing: ignored
      fields:
        - name: "links.link.#text"
          type: "string"
          required: false
          description: "External link URL"
          processing: ignored
        - name: "published"
          type: "string"
          required: false
          description: "Bio publication date"
          processing: ignored
        - name: "summary"
          type: "string"
          required: false
          description: "Short bio summary"
          processing: ignored
        - name: "content"
          type: "string"
          required: false
          description: "Full bio content"
          processing: ignored

processing_notes:
  - "Extract main artist entity with stats"
  - "Create similar artist relationships"
  - "Create tag relationships for artist"
  - "Convert listeners/playcount from string to numeric"
  - "Handle boolean fields (streamable, ontour)"

thresholds:
  - field: "stats.listeners"
    min_value: 1000
    description: "Minimum listeners count for artist approval"

relationship_creation:
  - type: "artist_similar"
    source: "main_artist"
    target: "similar_artists"
    bidirectional: true
  - type: "artist_tag"
    source: "main_artist"
    target: "tags"
