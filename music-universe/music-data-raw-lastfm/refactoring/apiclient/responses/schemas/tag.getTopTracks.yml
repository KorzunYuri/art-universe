# LastFM API Response Schema: tag.getTopTracks
# Purpose: Get top tracks for a specific tag

response_structure:
  root_key: "tracks"
  
  main_entity:
    type: "track_collection"
    description: "Collection of top tracks for a tag"

  attributes:
    - name: "@attr.tag"
      type: "string"
      required: true
      description: "Tag name"
      processing: ignored
    - name: "@attr.page"
      type: "string"
      required: false
      description: "Current page number"
      processing: ignored
    - name: "@attr.perPage"
      type: "string"
      required: false
      description: "Items per page"
      processing: ignored
    - name: "@attr.totalPages"
      type: "string"
      required: false
      description: "Total pages available"
      processing: ignored
    - name: "@attr.total"
      type: "string"
      required: false
      description: "Total tracks count"
      processing: ignored

  nested_entities:
    tracks:
      path: "track"
      type: "array"
      entity_type: "track"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Track name"
        - name: "mbid"
          type: "string"
          required: false
          description: "MusicBrainz ID"
        - name: "url"
          type: "string"
          required: true
          description: "LastFM URL for the track"
        - name: "duration"
          type: "string"
          required: false
          description: "Track duration in milliseconds"
        - name: "streamable"
          type: "object"
          required: false
          description: "Streamable information"
          processing: ignored
        - name: "@attr.rank"
          type: "string"
          required: false
          description: "Track rank in tag's top tracks"

    artist_info:
      path: "track[].artist"
      type: "object"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Artist name"
        - name: "mbid"
          type: "string"
          required: false
          description: "Artist MusicBrainz ID"
        - name: "url"
          type: "string"
          required: true
          description: "Artist LastFM URL"

    images:
      path: "track[].image"
      type: "array"
      entity_type: "image"
      processing: ignored
      fields:
        - name: "#text"
          type: "string"
          required: true
          description: "Image URL"
        - name: "size"
          type: "string"
          required: true
          description: "Image size (small, medium, large, extralarge, mega)"

    streamable_info:
      path: "track[].streamable"
      type: "object"
      processing: ignored
      fields:
        - name: "#text"
          type: "string"
          required: false
          description: "Whether track is streamable (0/1)"
        - name: "fulltrack"
          type: "string"
          required: false
          description: "Whether full track is streamable (0/1)"

processing_notes:
  - "Extract track entities with artist relationships"
  - "Create tag-track relationships"
  - "Use rank to determine track importance within tag"
  - "Create or update track and artist entities"
  - "Ensure tag entity exists before creating relationships"

relationship_creation:
  - type: "tag_track"
    source: "@attr.tag"
    target: "tracks"
    weight_field: "@attr.rank"
    description: "Create tag-track relationships with ranking"
  - type: "artist_track"
    source: "track.artist"
    target: "track"
    description: "Create artist-track relationships"

special_handling:
  - "Handle pagination attributes for potential follow-up calls"
  - "Use rank for relationship weight (lower rank = higher importance)"
  - "Convert duration from string to numeric (milliseconds)"
  - "Handle streamable object with nested properties"
  - "Ensure both tag and artist entities exist before creating track relationships"
