version: '3.8'

services:

  postgres:
    container_name: mu-raw-lastfm-prod-db-postgres
    restart: always
    shm_size: 128mb
    build:
      dockerfile: ../common/postgres.dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      MURAW_LASTFM_DB_PASSWORD: ${MURAW_LASTFM_DB_PASSWORD}
    volumes:
      - mu-raw-lastfm-prod-db-postgres-data:/var/lib/postgresql/data
      - ../common/initdb/templates:/docker-entrypoint-initdb.d

    command: bash -c "envsubst < /docker-entrypoint-initdb.d/init.sql.template > /docker-entrypoint-initdb.d/init.sql && exec docker-entrypoint.sh postgres"
    ports:
      - "9989:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-adminer:
    image: adminer
    restart: always
    ports:
      - "9988:8080"
    container_name: mu-raw-lastfm-prod-db-adminer

  app:
    build:
      context: ../../../../../../
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      MURAW_LASTFM_DB_HOST: postgres
      MURAW_LASTFM_DB_PORT: 5432
      MURAW_LASTFM_DB_PASSWORD: ${MURAW_LASTFM_DB_PASSWORD}
      MURAW_LASTFM_PORT: ${MURAW_LASTFM_PORT}
      MURAW_LASTFM_API_KEY: ${MURAW_LASTFM_API_KEY}
    volumes:
      - mu-raw-lastfm-prod-logs:/app/logs
    depends_on:
      - postgres

networks:
  default:
    name: mu-raw-lastfm-prod-network

volumes:
  mu-raw-lastfm-prod-db-postgres-data:
  mu-raw-lastfm-prod-logs:
