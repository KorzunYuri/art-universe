version: '3.8'

services:

  postgres:
    container_name: dev__music-data-raw-lastfm__db-postgres
    restart: always
    shm_size: 128mb
    build:
      dockerfile: ../common/postgres.dockerfile
      context: ../common
    env_file:
      - ${PROJECT_ROOT}/env/docker/local/music-data-raw-lastfm.env
      - ${PROJECT_ROOT}/env/docker/local/music-data-raw-lastfm.secrets.env
      - ${PROJECT_ROOT}/music-universe/music-data-raw-lastfm/dev.override.env
#    environment:
#      # for init.sql template
#      MURAW_LASTFM_DB_PASSWORD: ${MURAW_LASTFM_DB_PASSWORD}
    volumes:
      - db-postgres-data:/var/lib/postgresql/data
      - ../common/initdb/templates:/docker-entrypoint-initdb.d
    command: bash -c "envsubst < /docker-entrypoint-initdb.d/init.sql.template > /docker-entrypoint-initdb.d/init.sql && exec docker-entrypoint.sh postgres"
    ports:
      - "${MURAW_LASTFM_DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-adminer:
    container_name: dev__music-data-raw-lastfm__db-adminer
    image: adminer
    restart: always
    ports:
      - "${DB_ADMINER_PORT}:8080"

networks:
  default:
    name: mu-data-raw-lastfm-network

volumes:
  db-postgres-data:
    # share the volume with 'local' docker configuration
    name: local__mu-data-raw-lastfm__db-postgres-data
