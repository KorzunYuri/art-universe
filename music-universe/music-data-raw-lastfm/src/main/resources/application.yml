spring:
  application:
    name: music-universe-raw-data-service
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:9999/mu_raw_lastfm
    username: mu_raw_lastfm_dm
    password: ${DB_MURAW_LASTFM_PASSWORD}
    hikari:
      pool-name: MuRawLastFmHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 10
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/migration/muraw/liquibase/db.changelog.xml
  kafka:
    bootstrap-servers: localhost:29092,localhost:39092
    groups:
      tags: "mu-raw-lastfm-tags"
server:
  port: ${MURAW_LASTFM_PORT:8081}

scheduling:
  cron:
    lastfm:
      tags: "0 0 21 * * *"

messaging:
  lastfm:
    topics:
      tags:
        topTags: "tags.topTags"

logging:
  level:
    liquibase: DEBUG
