spring:
  application:
    name: music-universe-raw-data-service
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:9999/mu_raw_lastfm
    username: mu_raw_lastfm_dm
    password: ${DB_MURAW_LASTFM_PASSWORD}
    hikari:
      pool-name: MuRawLastFmHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 10
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/migration/muraw/liquibase/db.changelog.xml
  kafka:
    bootstrap-servers: localhost:29092,localhost:39092
    groups:
      tags: "mu-raw-lastfm-tags"
server:
  port: ${MURAW_LASTFM_PORT:8081}

scheduling:
  lastfm:
    apicalls:
      fetch:
        fixedRate: 5
#       Cron: "*/5 * * * * *"
    tasks:
      tag:
        topTags:
          cron: "0 0 21 * * *"

lastfm:
  baseUrl: "http://ws.audioscrobbler.com/2.0/"
  apikey: ${LASTFM_API_KEY}
  client:
    callsPerSec: 1
    retry:
      max-attempts: 3
      initial-delay-ms: 500
      multiplier: 1.5

logging:
  level:
    liquibase: DEBUG
