version: '3.8'

services:
  postgres:
    container_name: mu-shared-db-postgres
    restart: always
    shm_size: 128mb
    build:
      dockerfile: ../common/postgres.dockerfile
      context: ../common
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${PG_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      MU_DB_PASSWORD_DM: ${MU_DB_PASSWORD_DM}
      MU_QUIZ_DB_PASSWORD_DM: ${MU_QUIZ_DB_PASSWORD_DM}
    volumes:
      - mu-shared-db-postgres-data:/var/lib/postgresql/data
      - ../common/initdb/templates:/docker-entrypoint-initdb.d
    command: bash -c "envsubst < /docker-entrypoint-initdb.d/init.sql.template > /docker-entrypoint-initdb.d/init.sql && exec docker-entrypoint.sh postgres"
    ports:
      - "9989:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db-adminer:
    image: adminer
    restart: always
    ports:
      - "9988:8080"
    container_name: mu-shared-db-adminer

networks:
  default:
    name: mu-shared-network

volumes:
  mu-shared-db-postgres-data:
