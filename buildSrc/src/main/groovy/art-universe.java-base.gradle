plugins {
    id 'java'
    id 'io.spring.dependency-management'
    id 'jacoco'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.4.3"
    }
    dependencies {
        dependency "org.projectlombok:lombok:1.18.30"
    }
}

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}


tasks.withType(Test).configureEach {
    useJUnitPlatform {
        if (project.hasProperty("excludeIntegrationTests")) {
            excludeTags 'integration'
        }
    }
}

tasks.register('integrationTest', Test) {
    description = "Runs integration tests"
    group = "verification"

    useJUnitPlatform {
        includeTags 'integration'
    }

    shouldRunAfter test
}

jacocoTestReport {
    dependsOn test // tests are required to run before generating the jacoco report
    reports {
        xml.required = true
    }
}

test {
    finalizedBy jacocoTestReport  // report is always generated after tests run
}

tasks.register('jacocoSummary') {
    dependsOn jacocoTestReport

    doLast {
        def report = file("$buildDir/reports/jacoco/test/jacocoTestReport.xml")
        def parser = new XmlParser(false, false)
        parser.setFeature("http://apache.org/xml/features/disallow-doctype-decl", false)
        parser.setFeature("http://xml.org/sax/features/external-general-entities", false)
        parser.setFeature("http://xml.org/sax/features/external-parameter-entities", false)
        parser.setEntityResolver { publicId, systemId ->
            new org.xml.sax.InputSource(new java.io.StringReader(""))
        }
        def xml = parser.parse(report)

        xml.'package'.each { pkg ->
            pkg.'class'.each { cls ->
                def lineCounter = cls.counter.find { it.@type == 'LINE' }
                if (lineCounter) {
                    def missed = lineCounter.@missed.toInteger()
                    def covered = lineCounter.@covered.toInteger()
                    def total = missed + covered
                    def coverage = total > 0 ? (covered * 100 / total) : 100

                    if (coverage < 80) {
                        println "${cls.@name} -> ${coverage}% (missed: $missed)"
                    }
                }
            }
        }
    }
}

clean.doLast {
    def logsDir = file('logs')
    if (logsDir.exists() && logsDir.isDirectory()) {
        logsDir.listFiles().each { file ->
            delete file
        }
    }
}