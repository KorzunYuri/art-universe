spring:
  application:
    name: au-auth-service
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
      - classpath:commons-security.yml
      - optional:classpath:commons-security-${spring.profiles.active}.yml
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${AU_DB_MASTER_HOST}:${AU_DB_MASTER_PORT}/${AU_DB_NAME}?currentSchema=${AU_AUTH_DB_SCHEMA}
    username: ${AU_AUTH_DB_USERNAME}
    password: '${AU_AUTH_DB_PASSWORD_DM}'
    hikari:
      pool-name: AuAuthHikariPool
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    database: postgresql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
    hibernate:
      ddl-auto: none
  liquibase:
    default-schema: ${AU_AUTH_DB_SCHEMA}
    change-log: classpath:db/migration/au_auth/liquibase/db.changelog.xml

server:
  port: ${AU_AUTH_APP_INTERNAL_PORT:8080}
  allowed-origins: ${AU_AUTH_CORS_ALLOWED_ORIGINS}

auth:
  security:
    public-paths: /health, /actuator/**, /api/v1/auth/login, /api/v1/auth/refresh
    allowed-origins: ${AU_AUTH_CORS_ALLOWED_ORIGINS}
  google:
    client-id: ${AUTH_GOOGLE_CLIENT_ID:}
  refresh-token:
    expiration-days: ${AUTH_REFRESH_TOKEN_EXPIRATION_DAYS:7}
