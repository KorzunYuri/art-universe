spring:
  application:
    name: music-universe-data-service
  profiles:
    include: common
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${MU_DATA_DB_HOST:localhost}:${MU_DATA_DB_PORT:5432}/music_universe?currentSchema=mu
    username: mu_dm
    password: '${MU_DATA_DB_PASSWORD_DM}'
    hikari:
      pool-name: MuFmHikariPool
      maximum-pool-size: 2
      minimum-idle: 1
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: none
  liquibase:
    change-log: classpath:db/migration/mu/liquibase/db.changelog.xml
  docker:
    compose:
      enabled: false

server:
#  address: 0.0.0.0
  port: ${MU_DATA_APP_INTERNAL_PORT:8080}
  allowed-origins: ${MU_DATA_APP_CORS_ALLOWED_ORIGINS}

management:
  server:
    port: ${MU_DATA_ACTUATOR_INTERNAL_PORT:8090}
