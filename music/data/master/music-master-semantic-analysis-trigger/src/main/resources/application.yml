spring:
  application:
    name: music-master-semantic-analysis-trigger
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${AU_DB_MASTER_HOST}:${AU_DB_MASTER_PORT}/${AU_DB_NAME}?currentSchema=${MU_DATA_DB_SCHEMA}
    username: ${MU_DATA_DB_USERNAME}
    password: '${MU_DATA_DB_PASSWORD_DM}'
    hikari:
      pool-name: MasterTriggerHikariPool
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${MUSIC_MASTER_SEMANTIC_ANALYSIS_TRIGGER_PORT:8080}

au:
  config:
    client:
      service-url: "${AU_CONFIG_SERVICE_URL:stub-for-tests}"

trigger:
  ticket-intake:
    url: ${TICKET_INTAKE_URL}
