spring:
  application:
    name: semantic-analyzer
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
  datasource:
    url: jdbc:postgresql://${AU_DB_MASTER_HOST}:${AU_DB_MASTER_PORT}/${AU_DB_NAME}?currentSchema=mu_semantic_analysis
    username: ${MU_SA_DB_USERNAME}
    password: '${MU_SA_DB_PASSWORD_DM}'
    hikari:
      pool-name: SemanticAnalyzerHikariPool
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: ${SEMANTIC_ANALYZER_PORT:8080}

au:
  config:
    client:
      service-url: "${AU_CONFIG_SERVICE_URL:stub-for-tests}"

semantic:
  llm:
    clients:
      extraction:
        provider: openai
        api-key: ${GEMINI_API_KEY:}
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        model: gemini-2.5-flash
        temperature: 0.2
        connect-timeout: 10s
        read-timeout: 120s
      creative:
        provider: openai
        api-key: ${GROQ_API_KEY:}
        base-url: https://api.groq.com/openai/v1
        model: llama-3.3-70b-versatile
        temperature: 1.2
        connect-timeout: 10s
        read-timeout: 60s
  modes:
    full_extraction: extraction
    creative_categorization: creative
  cache:
    category-refresh-ms: ${CATEGORY_CACHE_REFRESH_MS:300000}
