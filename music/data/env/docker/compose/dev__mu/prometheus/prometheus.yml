global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Core services
  - job_name: 'music-data'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:7092']

  - job_name: 'music-quiz'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:7093']

  # LastFM web services
  - job_name: 'lastfm-rest-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:7094']

  - job_name: 'lastfm-etl-rest-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:7095']

  # LastFM ETL services
  - job_name: 'lastfm-calls-generator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:7096']

  - job_name: 'lastfm-calls-performer'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:7097']

  - job_name: 'lastfm-response-parser'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:7098']
