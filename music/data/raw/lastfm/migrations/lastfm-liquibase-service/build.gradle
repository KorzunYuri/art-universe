plugins {
    id 'art-universe.java-base'
    id 'application'
}

archivesBaseName = 'lastfm-liquibase-service'

application {
    mainClass = 'yurykorzun.art.universe.music.data.raw.lastfm.migration.liquibase.LiquibaseMigrationRunner'
}

dependencies {
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'
}

// Copy resources to main resources for classpath access (IDE/local run)
tasks.register('copyLiquibaseResources', Copy) {
    from project(':music:data:raw:lastfm:migrations:lastfm-liquibase-resources').file('src/main/resources')
    into "$buildDir/resources/main"
}

processResources {
    dependsOn copyLiquibaseResources
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
        attributes 'Class-Path': configurations.runtimeClasspath.files.collect { "lib/${it.name}" }.join(' ')
    }
}

tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/libs/lib"
}

// Copy resources to separate directory for Docker
tasks.register('copyLiquibaseResourcesForDocker', Copy) {
    from project(':music:data:raw:lastfm:migrations:lastfm-liquibase-resources').file('src/main/resources')
    into "$buildDir/libs/resources"
}

jar.dependsOn copyDependencies, copyLiquibaseResourcesForDocker
