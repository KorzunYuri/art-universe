plugins {
    id 'art-universe.spring-boot-app-with-metrics'
}

archivesBaseName = 'lastfm-etl-calls-generator'

dependencies {
    implementation project(':music:data:raw:lastfm:lastfm-repositories')
    implementation project(':music:data:raw:lastfm:etl:lastfm-tasks-coordinator')

    testImplementation project(':music:data:raw:lastfm:test:lastfm-commons-test-db-helper')
    testImplementation project(':music:data:raw:lastfm:test:lastfm-commons-test')
    testImplementation project(':music:data:raw:lastfm:test:lastfm-commons-test-jpa')

    testRuntimeOnly 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.testcontainers:testcontainers'
}
