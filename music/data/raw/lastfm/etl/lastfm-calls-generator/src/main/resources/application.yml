spring:
  application:
    name: lastfm-calls-generator
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
  lifecycle:
    timeout-per-shutdown-phase: 300s
  datasource:
    driverClassName: org.postgresql.Driver
    # Use master for write operations with DM user (falls back to default host for compatibility)
    url: jdbc:postgresql://${AU_DB_MASTER_HOST}:${AU_DB_MASTER_PORT}/${AU_DB_NAME}?currentSchema=${MURAW_LASTFM_DB_SCHEMA}
    username: ${MURAW_LASTFM_DB_WRITER_USERNAME}
    password: '${MURAW_LASTFM_DB_WRITER_PASSWORD}'
    hikari:
      pool-name: LastfmCallsGeneratorHikariPool
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        javax.persistence.validation.mode: none
    hibernate:
      ddl-auto: none

server:
  # Non-web app - only needs actuator endpoints
  port: ${MURAW_LASTFM_CALLS_GENERATOR_ACTUATOR_INTERNAL_PORT}

au:
  config:
    client:
      service-url: "${AU_CONFIG_SERVICE_URL}"

lastfm:
  scheduling:
    pool:
      size: 2
      await-termination-secs: 300
    calls-generate:
      fixed-delay-secs: 60
  tasks:
    calls-generate:
      due-duration-days:
        album-get-info: 28
        artist-get-info: 7
        artist-get-similar: 28
        artist-top-tags: 7
        artist-top-albums: 28
        artist-top-tracks: 28
        tag-top-tags: 7
        tag-top-artists: 7
        tag-top-tracks: 7
        track-get-info: 56
      records-limit:
        tag-top-tags: 2000 # it is known that Lastfm API offset breaks after 2000th record for this method
      usage-to-page-ratio:
        tag-top-tracks: 50000 # for each N usages of the tag, ONE 50-items api call will be generated
