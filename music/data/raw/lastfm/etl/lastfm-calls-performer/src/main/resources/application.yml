spring:
  application:
    name: lastfm-calls-performer
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
  lifecycle:
    timeout-per-shutdown-phase: 90s
  datasource:
    driverClassName: org.postgresql.Driver
    # Use master for write operations with DM user (falls back to default host for compatibility)
    url: jdbc:postgresql://${MURAW_LASTFM_DB_MASTER_HOST}:${MURAW_LASTFM_DB_MASTER_PORT}/${MURAW_LASTFM_DB_NAME}?currentSchema=${MURAW_LASTFM_DB_SCHEMA}
    username: ${MURAW_LASTFM_DB_WRITER_USERNAME}
    password: '${MURAW_LASTFM_DB_WRITER_PASSWORD}'
    hikari:
      pool-name: LastfmCallsPerformerHikariPool
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        javax.persistence.validation.mode: none
    hibernate:
      ddl-auto: none

server:
  # Non-web app - only needs actuator endpoints
  port: ${MURAW_LASTFM_CALLS_PERFORMER_ACTUATOR_INTERNAL_PORT}

lastfm:
  api:
    base-url: "http://ws.audioscrobbler.com/2.0/"
    key: ${MURAW_LASTFM_API_KEY}
  scheduling:
    pool:
      size: 2
      await-termination-secs: 300
    calls-perform:
      fixed-delay-secs: 1
  tasks:
    calls-perform:
      calls-per-sec: 1.0
      retry:
        max-attempts: 3
        initial-delay-ms: 500
        multiplier: 1.5
