plugins {
    id 'art-universe.spring-boot-app'
}

archivesBaseName = 'lastfm-etl-response-parser'
ext.dockerImageName = 'mu-lastfm-response-parser'

dependencies {
    implementation project(':common:commons-observability')
    implementation project(':music:data:raw:lastfm:lastfm-repositories')

    implementation 'info.debatty:java-string-similarity:2.0.0'

    // web for actuator endpoints
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation project(':music:data:raw:lastfm:test:lastfm-commons-test-context')
    testImplementation project(':music:data:raw:lastfm:test:lastfm-commons-test-db-helper')
    testImplementation project(':music:data:raw:lastfm:test:lastfm-commons-test-jpa')

    testRuntimeOnly 'org.testcontainers:postgresql'
}
