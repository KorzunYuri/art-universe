spring:
  application:
    name: lastfm-response-parser
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
  lifecycle:
    timeout-per-shutdown-phase: 300s
  datasource:
    driverClassName: org.postgresql.Driver
    # Use master for write operations with DM user (falls back to default host for compatibility)
    url: jdbc:postgresql://${MURAW_LASTFM_DB_MASTER_HOST}:${MURAW_LASTFM_DB_MASTER_PORT}/${MURAW_LASTFM_DB_NAME}?currentSchema=${MURAW_LASTFM_DB_SCHEMA}
    username: ${MURAW_LASTFM_DB_WRITER_USERNAME}
    password: '${MURAW_LASTFM_DB_WRITER_PASSWORD}'
    hikari:
      pool-name: LastfmResponseParserHikariPool
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        javax.persistence.validation.mode: none
    hibernate:
      ddl-auto: none

server:
  # Non-web app - only needs actuator endpoints
  port: ${MURAW_LASTFM_RESPONSE_PARSER_ACTUATOR_INTERNAL_PORT}

lastfm:
  scheduling:
    pool:
      size: 4
      await-termination-secs: 300
    response-parse:
      fixed-delay-secs: 5
    attribute-history:
      fixed-delay-secs: 30
  tasks:
    response-parse:
      thresholds:
        artist:
          listeners-count: 1000
        album:
          play-count: 10000
        track:
          play-count: 1000
        tag:
          usage-count: 1000
      methods:
        artist:
          get-similar:
            artist-match-threshold: 0.2
          top-tags:
            tag-usage-count-threshold: 10
          top-albums:
            album-play-count-threshold: 10000
          search:
            artist-similarity-threshold: 0.5
