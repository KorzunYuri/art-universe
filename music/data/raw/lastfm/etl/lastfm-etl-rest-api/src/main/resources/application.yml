# all the default variables are provided for testing purposes (otherwise we would have to set those in application-test.yml)
spring:
  application:
    name: music-universe-raw-data-service
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${MURAW_LASTFM_DB_HOST:localhost}:${MURAW_LASTFM_DB_PORT:5432}/music_universe?currentSchema=mu_raw_lastfm
    username: mu_raw_lastfm_dm
    password: '${MURAW_LASTFM_DB_PASSWORD}'
    hikari:
      pool-name: MuRawLastFmHikariPool
      maximum-pool-size: 4
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: none

server:
  address: 0.0.0.0
  port: ${MURAW_LASTFM_APP_INTERNAL_PORT:8080}
  allowed-origins: ${MURAW_LASTFM_APP_CORS_ALLOWED_ORIGINS}

music-data-master:
  base-url: ${MU_DATA_APP_HOST:localhost}:${MU_DATA_APP_PORT:8080}
  unbind:
    batch-size: 1000

lastfm:
  threshold:
    artist:
      listenersCount: 1000
    album:
      playCount: 10000
    track:
      playCount: 1000
    tag:
      usageCount: 1000
