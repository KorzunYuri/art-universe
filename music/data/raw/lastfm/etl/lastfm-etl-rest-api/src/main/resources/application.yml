spring:
  application:
    name: lastfm-etl-rest-api
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${MURAW_LASTFM_DB_HOST}:${MURAW_LASTFM_DB_PORT}/${MURAW_LASTFM_DB_NAME}?currentSchema=${MURAW_LASTFM_DB_SCHEMA}
    username: ${MURAW_LASTFM_DB_USER_NAME}
    password: '${MURAW_LASTFM_DB_PASSWORD}'
    hikari:
      pool-name: LastfmEtlRestApiHikariPool
      maximum-pool-size: 4
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: none

server:
  address: 0.0.0.0
  port: ${MURAW_LASTFM_ETL_REST_API_INTERNAL_PORT:8080}
  allowed-origins: ${MURAW_LASTFM_ETL_REST_API_CORS_ALLOWED_ORIGINS}
metrics:
  update:
    # Low impact queries - simple COUNT queries with existing indexes
    entity-counts:
      interval: 15000
    api-call-counts:
      interval: 15000
    api-response-counts:
      interval: 15000
    # Medium impact queries
    table-sizes:
      interval: 300000

music-data-master:
  base-url: ${MU_DATA_APP_HOST:localhost}:${MU_DATA_APP_PORT:8080}
  unbind:
    batch-size: 1000

lastfm:
  scheduling:
    maintenance:
      cron: "0 0 8 * * *"
  threshold:
    artist:
      listenersCount: 1000
    album:
      playCount: 10000
    track:
      playCount: 1000
    tag:
      usageCount: 1000
