spring:
  application:
    name: lastfm-etl-rest-api
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
  lifecycle:
    timeout-per-shutdown-phase: 300s
  datasource:
    driverClassName: org.postgresql.Driver
    # Use master for write operations with DM user (falls back to default host for compatibility)
    url: jdbc:postgresql://${AU_DB_MASTER_HOST}:${AU_DB_MASTER_PORT}/${AU_DB_NAME}?currentSchema=${MURAW_LASTFM_DB_SCHEMA}
    username: ${MURAW_LASTFM_DB_WRITER_USERNAME}
    password: '${MURAW_LASTFM_DB_WRITER_PASSWORD}'
    hikari:
      pool-name: LastfmEtlRestApiHikariPool
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    hibernate:
      ddl-auto: none

server:
  address: 0.0.0.0
  port: ${MURAW_LASTFM_ETL_REST_API_INTERNAL_PORT:8080}
  allowed-origins: ${MURAW_LASTFM_ETL_REST_API_CORS_ALLOWED_ORIGINS}

au:
  config:
    client:
      service-url: "${AU_CONFIG_SERVICE_URL}"

master:
  base-url: ${MU_DATA_APP_HOST:localhost}:${MU_DATA_APP_PORT:8080}
lastfm:
  scheduling:
    pool:
      size: 2
      await-termination-secs: 900
    maintenance:
      db:
        cron: "0 0 8 * * *"
  tasks:
    maintenance:
      db:
        unbind:
          batch-size: 1000
        thresholds:
          artist:
            listeners-count: 1000
          album:
            play-count: 10000
          track:
            play-count: 1000
          tag:
            usage-count: 1000
  metrics:
    update:
      # Low impact queries - simple COUNT queries with existing indexes
      entity-counts:
        interval: 15000
      api-call-counts:
        interval: 15000
      api-response-counts:
        interval: 15000
      # Medium impact queries
      table-sizes:
        interval: 300000
