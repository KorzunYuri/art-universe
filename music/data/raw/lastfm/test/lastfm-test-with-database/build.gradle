plugins {
    id 'art-universe.java-library'
}

archivesBaseName = 'lastfm-test-with-database'

dependencies {
    api project(':music:data:raw:lastfm:test:lastfm-test-commons')
    api project(':music:data:raw:lastfm:lastfm-models')
    implementation project(':music:data:raw:lastfm:migrations:lastfm-liquibase-resources')
    
    implementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.testcontainers:testcontainers'
    implementation 'org.testcontainers:junit-jupiter'
    implementation 'org.testcontainers:postgresql'
    implementation 'org.liquibase:liquibase-core'
}