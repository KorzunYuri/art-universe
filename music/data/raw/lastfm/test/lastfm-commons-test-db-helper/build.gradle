plugins {
    id 'art-universe.java-library'
}

archivesBaseName = 'lastfm-commons-test-db-helper'

dependencies {
    api project(':music:data:raw:lastfm:lastfm-models')
    api project(':music:data:raw:lastfm:lastfm-repositories')
    api project(':music:data:raw:lastfm:test:lastfm-commons-test-db')
    api project(':music:data:raw:lastfm:test:lastfm-commons-test-jpa')

    api 'org.springframework.boot:spring-boot-starter-test'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.springframework.data:spring-data-commons'
    api 'org.springframework.data:spring-data-jpa'
    api 'org.springframework:spring-context'
    
    implementation 'org.slf4j:slf4j-api'
    implementation project(':music:data:raw:lastfm:test:lastfm-commons-test')
}