# Common test configuration for database testing
spring:
  liquibase:
    change-log: classpath:db/migration/muraw/liquibase/db.changelog.xml
  jpa:
    properties:
      hibernate:
        show-sql: true

logging:
  level:
    org:
      springframework:
        transaction: TRACE
      hibernate:
        transaction: DEBUG
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
        orm:
          jdbc:
            bind: TRACE
