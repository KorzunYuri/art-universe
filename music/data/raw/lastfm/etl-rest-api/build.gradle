plugins {
    id 'art-universe.spring-boot-web-app'
}

dependencies {
    implementation project(':music:data:raw:lastfm:models')
    
    implementation 'io.micrometer:micrometer-registry-prometheus'
}

// disable until migration is finished
tasks.named('bootJar') {
    enabled = false
}
tasks.named('extractLayers') {
     enabled = false
}