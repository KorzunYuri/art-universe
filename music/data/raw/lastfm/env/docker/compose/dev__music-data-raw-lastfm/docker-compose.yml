# dev env

version: '3.8'

services:

  postgres:
    container_name: dev__music-data-raw-lastfm__db-postgres
    restart: unless-stopped
    shm_size: 128mb
    stop_grace_period: 1m
    stop_signal: SIGINT
    build:
      dockerfile: postgres.dockerfile
      context: .
    env_file:
      - ${PROJECT_ROOT}/env/docker/common/music-data-raw-lastfm.env
      - ${PROJECT_ROOT}/env/docker/local/music-data-raw-lastfm.env
      - ${PROJECT_ROOT}/env/docker/local/music-data-raw-lastfm.secrets.env
      - ${PROJECT_ROOT}/music/data/raw/lastfm/env/dev.override.env
    volumes:
      - db-postgres-data:/var/lib/postgresql/data
      - ./initdb/templates:/docker-entrypoint-initdb.d
    command: bash -c "envsubst < /docker-entrypoint-initdb.d/init.sql.template > /docker-entrypoint-initdb.d/init.sql && exec docker-entrypoint.sh postgres"
    ports:
      - "${MURAW_LASTFM_DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: dev__mu-data-raw-lastfm__network

volumes:
  db-postgres-data:
    name: dev__mu-data-raw-lastfm__db-postgres-data
