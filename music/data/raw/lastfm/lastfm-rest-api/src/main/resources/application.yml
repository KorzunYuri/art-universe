spring:
  application:
    name: lastfm-rest-api
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
      - classpath:commons-security.yml
      - optional:classpath:commons-security-${spring.profiles.active}.yml
  datasource:
    driverClassName: org.postgresql.Driver
    # Use replica for read operations with read-only user (falls back to master for compatibility)
    url: jdbc:postgresql://${AU_DB_REPLICA_HOST}:${AU_DB_REPLICA_PORT}/${AU_DB_NAME}?currentSchema=${MURAW_LASTFM_DB_SCHEMA}
    username: ${MURAW_LASTFM_DB_READER_USERNAME}
    password: '${MURAW_LASTFM_DB_READER_PASSWORD}'
    hikari:
      pool-name: MuRawLastFmHikariPool
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
    hibernate:
      ddl-auto: none

server:
  address: 0.0.0.0
  port: ${MURAW_LASTFM_REST_API_INTERNAL_PORT:8080}
  allowed-origins: ${MURAW_LASTFM_REST_API_CORS_ALLOWED_ORIGINS}

auth:
  security:
    public-paths: /health, /actuator/**
    allowed-origins: ${MURAW_LASTFM_REST_API_CORS_ALLOWED_ORIGINS}
