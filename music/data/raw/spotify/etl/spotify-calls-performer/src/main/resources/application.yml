spring:
  application:
    name: spotify-calls-performer
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
  lifecycle:
    timeout-per-shutdown-phase: 90s
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${AU_DB_MASTER_HOST}:${AU_DB_MASTER_PORT}/${AU_DB_NAME}?currentSchema=${MURAW_SPOTIFY_DB_SCHEMA}
    username: ${MURAW_SPOTIFY_CALLS_PERFORMER_DB_USERNAME}
    password: '${MURAW_SPOTIFY_CALLS_PERFORMER_DB_PASSWORD}'
    hikari:
      pool-name: SpotifyCallsPerformerHikariPool
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        javax.persistence.validation.mode: none
    hibernate:
      ddl-auto: none

server:
  # Non-web app - only needs actuator endpoints
  port: ${MURAW_SPOTIFY_CALLS_PERFORMER_ACTUATOR_INTERNAL_PORT:8080}

spotify:
  api:
    base-url: ${SPOTIFY_API_BASE_URL:https://api.spotify.com/v1}
    client-id: ${SPOTIFY_CLIENT_ID}
    client-secret: ${SPOTIFY_CLIENT_SECRET}
    token-url: ${SPOTIFY_TOKEN_URL:https://accounts.spotify.com/api/token}
  scheduling:
    calls-perform:
      fixed-delay-secs: ${SPOTIFY_SCHEDULING_CALLS_PERFORM_FIXED_DELAY_SECS:1}
  tasks:
    calls-perform:
      rate-limiter:
        initial-delay-ms: ${SPOTIFY_RATE_LIMITER_INITIAL_DELAY_MS:1000}
        min-delay-ms: ${SPOTIFY_RATE_LIMITER_MIN_DELAY_MS:200}
        max-delay-ms: ${SPOTIFY_RATE_LIMITER_MAX_DELAY_MS:30000}
        backoff-multiplier: ${SPOTIFY_RATE_LIMITER_BACKOFF_MULTIPLIER:2.0}
        recovery-step-ms: ${SPOTIFY_RATE_LIMITER_RECOVERY_STEP_MS:100}
      retry:
        max-attempts: 3
        initial-delay-ms: 500
        multiplier: 1.5
