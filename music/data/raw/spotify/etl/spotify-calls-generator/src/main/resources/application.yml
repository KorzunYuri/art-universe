spring:
  application:
    name: spotify-calls-generator
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
  lifecycle:
    timeout-per-shutdown-phase: 300s
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${AU_DB_MASTER_HOST}:${AU_DB_MASTER_PORT}/${AU_DB_NAME}?currentSchema=${MURAW_SPOTIFY_DB_SCHEMA}
    username: ${MURAW_SPOTIFY_CALLS_GENERATOR_DB_USERNAME}
    password: '${MURAW_SPOTIFY_CALLS_GENERATOR_DB_PASSWORD}'
    hikari:
      pool-name: SpotifyCallsGeneratorHikariPool
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        javax.persistence.validation.mode: none
    hibernate:
      ddl-auto: none

server:
  # Non-web app - only needs actuator endpoints
  port: ${MURAW_SPOTIFY_CALLS_GENERATOR_ACTUATOR_INTERNAL_PORT:8080}

au:
  config:
    client:
      service-url: "${AU_CONFIG_SERVICE_URL}"

spotify:
  scheduling:
    calls-generate:
      fixed-delay-secs: ${SPOTIFY_SCHEDULING_CALLS_GENERATE_FIXED_DELAY_SECS:60}
  tasks:
    calls-generate:
      due-duration-days:
        artist-get: 30
        artist-albums: 30
        album-get: 30
        album-tracks: 30
        track-get: 30
        search-artist: 7
        search-album: 7
        search-track: 7
      search:
        enabled: ${SPOTIFY_SEARCH_ENABLED:false}
        batch-size: ${SPOTIFY_SEARCH_BATCH_SIZE:100}
        grace-period-days: ${SPOTIFY_SEARCH_GRACE_PERIOD_DAYS:30}
