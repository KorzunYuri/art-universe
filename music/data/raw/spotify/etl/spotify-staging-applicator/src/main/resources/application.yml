spring:
  application:
    name: spotify-staging-applicator
  config:
    import:
      - classpath:commons-context.yml
      - optional:classpath:commons-context-${spring.profiles.active}.yml
      - classpath:commons-observability.yml
      - optional:classpath:commons-observability-${spring.profiles.active}.yml
  lifecycle:
    timeout-per-shutdown-phase: 90s
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${AU_DB_MASTER_HOST}:${AU_DB_MASTER_PORT}/${AU_DB_NAME}?currentSchema=${MURAW_SPOTIFY_DB_SCHEMA}
    username: ${MURAW_SPOTIFY_STAGING_APPLICATOR_DB_USERNAME}
    password: '${MURAW_SPOTIFY_STAGING_APPLICATOR_DB_PASSWORD}'
    hikari:
      pool-name: SpotifyStagingApplicatorHikariPool
      maximum-pool-size: 8
      minimum-idle: 2
  jpa:
    database: postgresql
    properties:
      hibernate:
        order_by:
          default_null_ordering: last
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        javax.persistence.validation.mode: none
    hibernate:
      ddl-auto: none

server:
  # Non-web app - only needs actuator endpoints
  port: ${MURAW_SPOTIFY_STAGING_APPLICATOR_ACTUATOR_INTERNAL_PORT:8080}

spotify:
  scheduling:
    staging-apply:
      fixed-delay-secs: ${SPOTIFY_SCHEDULING_STAGING_APPLY_FIXED_DELAY_SECS:10}
    staging-cleanup:
      fixed-delay-secs: ${SPOTIFY_SCHEDULING_STAGING_CLEANUP_FIXED_DELAY_SECS:3600}
  staging:
    cleanup:
      completed-retention-hours: ${SPOTIFY_STAGING_CLEANUP_RETENTION_HOURS:24}
  integration:
    music-data-master:
      base-url: http://${MU_DATA_APP_HOST}:${MU_DATA_APP_PORT}
