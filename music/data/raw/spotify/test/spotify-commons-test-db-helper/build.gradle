plugins {
    id 'art-universe.java-library'
}

archivesBaseName = 'spotify-commons-test-db-helper'

dependencies {
    api project(':music:data:raw:spotify:spotify-models')
    api project(':music:data:raw:spotify:spotify-repositories')
    api project(':music:data:raw:spotify:test:spotify-commons-test-db')

    api 'org.springframework.boot:spring-boot-starter-test'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'jakarta.persistence:jakarta.persistence-api'
    api 'org.springframework.data:spring-data-commons'
    api 'org.springframework.data:spring-data-jpa'
    api 'org.springframework:spring-context'

    implementation 'org.slf4j:slf4j-api'
}
