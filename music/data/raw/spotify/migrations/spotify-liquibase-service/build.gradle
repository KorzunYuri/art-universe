plugins {
    id 'art-universe.java-base'
    id 'application'
}

archivesBaseName = 'spotify-liquibase-service'

application {
    mainClass = 'yurykorzun.art.universe.music.data.raw.spotify.migration.liquibase.LiquibaseMigrationRunner'
}

dependencies {
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'
}

tasks.register('copyLiquibaseResources', Copy) {
    from project(':music:data:raw:spotify:migrations:spotify-liquibase-resources').file('src/main/resources')
    into "$buildDir/resources/main"
}

processResources {
    dependsOn copyLiquibaseResources
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
        attributes 'Class-Path': configurations.runtimeClasspath.files.collect { "lib/${it.name}" }.join(' ')
    }
}

tasks.register('copyDependencies', Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/libs/lib"
}

tasks.register('copyLiquibaseResourcesForDocker', Copy) {
    from project(':music:data:raw:spotify:migrations:spotify-liquibase-resources').file('src/main/resources')
    into "$buildDir/libs/resources"
}

jar.dependsOn copyDependencies, copyLiquibaseResourcesForDocker

ext.dockerImageName = 'mu-spotify-liquibase'

tasks.register('dockerBuild', Exec) {
    group = 'docker'
    description = "Build Docker image ${project.dockerImageName}"
    dependsOn tasks.named('jar')

    def imageName = "${project.dockerImageName}:latest"
    def dockerContext = project.projectDir

    commandLine 'docker', 'build', '-t', imageName, '-f', "${dockerContext}/Dockerfile", dockerContext.absolutePath

    doFirst {
        println "Building Docker image: ${imageName} from ${dockerContext}"
    }
}
