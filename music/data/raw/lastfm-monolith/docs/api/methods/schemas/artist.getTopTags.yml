# LastFM API Response Schema: artist.getTopTags
# Purpose: Get top tags for a specific artist

response_structure:
  root_key: "toptags"
  
  main_entity:
    type: "tag_collection"
    description: "Collection of tags associated with an artist"

  attributes:
    - name: "@attr.artist"
      type: "string"
      required: true
      description: "Artist name"

  nested_entities:
    tags:
      path: "tag"
      type: "array"
      entity_type: "tag"
      fields:
        - name: "name"
          type: "string"
          required: true
          description: "Tag name"
        - name: "url"
          type: "string"
          required: true
          description: "LastFM URL for the tag"
        - name: "count"
          type: "integer"
          required: true
          description: "Usage count for this tag on this artist"

processing_notes:
  - "Extract tag entities and create artist-tag relationships"
  - "Use count field to determine tag relevance/weight"
  - "Filter tags based on usage count threshold"
  - "Create or update existing tag entities"

thresholds:
  - field: "count"
    min_value: 10
    description: "Minimum tag usage count for processing"

relationship_creation:
  - type: "artist_tag"
    source: "@attr.artist"
    target: "tags"
    weight_field: "count"
    description: "Create artist-tag relationships with usage counts"

special_handling:
  - "Ensure artist entity exists before creating tag relationships"
  - "Handle cases where tag might already exist"
  - "Use count as relationship weight for tag importance"
